<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block;width:540px;height:960px}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=540,H=960;
function R(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function lerp(a,b,u){return a+(b-a)*u;}
function ease(u){u=clamp(u,0,1);return u*u*(3-2*u);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ---- layout: vertical transport path at x=PX ----
const PX=330;
const STACK={x:120,y:700,w:260,h:150};      // feed stack bottom
const ROLL={x:PX+60,y:672,r:26};            // friction roller
const THK={y:560};                          // thickness pinch
const OPT={y:440};                          // optical scan
const MAG={y:362};                          // magnetic coil
const GATE={y:286};                         // sort gate
const OUT={x:206,y:152,w:168,h:90};         // output tray (top-left, in housing)
const REJ={x:398,y:146,w:122,h:112};        // reject bin (top-right, in housing)
const CNT={x:26,y:300,w:180,h:70};          // counter display (mounted outside-left)

const SPAWN=0.40, SPEED=340;                 // px/s upward
function isDouble(i){return i%7===3;}
function isFake(i){return i%11===5;}

const CAM=[
 [0.0,3.2, 290,520, 1.00,1.08],
 [3.2,6.4, PX+10,562, 1.80,1.92],
 [6.4,9.6, 390,250, 1.55,1.65],
 [9.6,13.0, PX+14,408, 1.78,1.88],
 [13.0,16.9, 290,500, 1.14,1.03]
];
function camera(t){
 for(const s of CAM){if(t>=s[0]&&t<s[1]){const u=ease((t-s[0])/(s[1]-s[0]));return{cx:s[2],cy:s[3],z:lerp(s[4],s[5],u)};}}
 const s=CAM[CAM.length-1];return{cx:s[2],cy:s[3],z:s[5]};
}

function bg(t){
 const g=ctx.createRadialGradient(W/2,H*0.42,60,W/2,H*0.5,700);
 g.addColorStop(0,'#1c2433');g.addColorStop(0.55,'#0d1420');g.addColorStop(1,'#04060b');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.globalCompositeOperation='lighter';
 const sh=ctx.createLinearGradient(0,0,0,H*0.72);
 sh.addColorStop(0,'rgba(140,170,220,0.09)');sh.addColorStop(1,'rgba(140,170,220,0)');
 ctx.beginPath();ctx.moveTo(W*0.28,-20);ctx.lineTo(W*0.72,-20);ctx.lineTo(W*0.94,H*0.72);ctx.lineTo(W*0.06,H*0.72);ctx.closePath();
 ctx.fillStyle=sh;ctx.fill();
 for(let i=0;i<16;i++){
  const sp=5+R(i)*9,x=(R(i+40)*W+t*sp)%W,y=(R(i+80)*H+t*3)%H;
  ctx.globalAlpha=0.05+0.06*R(i+7);ctx.fillStyle='#bcd3ee';
  ctx.beginPath();ctx.arc(x,y,0.8+R(i+3)*1.1,0,7);ctx.fill();
 }
 ctx.restore();
}
function steel(x0,y0,x1,y1){
 const g=ctx.createLinearGradient(x0,y0,x1,y1);
 g.addColorStop(0,'#8d97a6');g.addColorStop(0.3,'#5d6673');g.addColorStop(0.6,'#3a414c');g.addColorStop(1,'#262b33');
 return g;
}
function note(x,y,ang,dbl,bad,glow){
 ctx.save();ctx.translate(x,y);ctx.rotate(ang);
 if(dbl){ // two stuck notes offset
  ctx.save();ctx.translate(3,4);
  rr(-23,-11,46,22,4);ctx.fillStyle='#7e9178';ctx.fill();
  ctx.restore();
 }
 const g=ctx.createLinearGradient(0,-11,0,11);
 g.addColorStop(0,'#c2d3bc');g.addColorStop(0.5,'#9fb49a');g.addColorStop(1,'#7e9178');
 rr(-23,-11,46,22,4);ctx.fillStyle=g;ctx.fill();
 rr(-23,-11,46,22,4);ctx.strokeStyle=bad?'#ff5a40':'rgba(40,60,40,0.8)';ctx.lineWidth=bad?2.4:1.2;
 if(bad){ctx.save();ctx.shadowColor='rgba(255,70,40,0.9)';ctx.shadowBlur=12;ctx.stroke();ctx.restore();}else ctx.stroke();
 ctx.strokeStyle='rgba(50,70,50,0.5)';ctx.lineWidth=1;
 ctx.beginPath();ctx.ellipse(0,0,8,6,0,0,7);ctx.stroke();
 if(glow){ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(120,220,255,0.25)';rr(-23,-11,46,22,4);ctx.fill();ctx.restore();}
 ctx.restore();
}

// note world-state at time t for spawn index i -> {x,y,ang,phase} or null
function notePos(t,i){
 const ts=i*SPAWN+0.3;
 if(t<ts) return null;
 const a=t-ts;
 const peel=0.22;                       // peel off stack
 if(a<peel){
  const u=a/peel;
  return {x:lerp(STACK.x+STACK.w/2,PX,u), y:lerp(STACK.y-10,STACK.y-50,u), ang:lerp(0,-0.06,u), st:'peel'};
 }
 const b=a-peel;
 const y=STACK.y-50-b*SPEED;
 const rej=isDouble(i)||isFake(i);
 if(y>GATE.y){ // travelling up
  return {x:PX+2*Math.sin(b*9+i), y:y, ang:-0.04+0.03*Math.sin(b*7+i), st:'up'};
 }
 // past gate: branch
 const c=(GATE.y-y)/SPEED; // time past gate
 if(rej){
  const u=clamp(c*3.2,0,1);
  if(u>=1) return null;
  return {x:lerp(PX,REJ.x+REJ.w/2,u), y:lerp(GATE.y,REJ.y+REJ.h/2,u*u), ang:u*1.6, st:'rej'};
 }
 const u=clamp(c*2.6,0,1);
 if(u>=1) return null;
 return {x:lerp(PX,OUT.x+OUT.w/2,u), y:lerp(GATE.y,OUT.y+OUT.h-18,u), ang:lerp(-0.04,0,u), st:'out'};
}

function machine(t){
 // ===== machine housing (cutaway cabinet) =====
 ctx.save();ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=30;ctx.shadowOffsetY=14;
 rr(176,104,352,656,22);ctx.fillStyle=steel(0,104,0,760);ctx.fill();ctx.restore();
 // inner cutaway cavity
 const cg=ctx.createLinearGradient(0,124,0,740);
 cg.addColorStop(0,'#0e131c');cg.addColorStop(0.5,'#080b11');cg.addColorStop(1,'#0c1018');
 rr(196,124,312,616,14);ctx.fillStyle=cg;ctx.fill();
 rr(196,124,312,616,14);ctx.strokeStyle='#79828f';ctx.lineWidth=2.2;ctx.stroke();
 // rivets on housing frame
 for(const[rx,ry]of[[190,118],[514,118],[190,746],[514,746]]){
  const rg0=ctx.createRadialGradient(rx-1.5,ry-1.5,0.5,rx,ry,5);
  rg0.addColorStop(0,'#aeb9c6');rg0.addColorStop(1,'#3a404a');
  ctx.beginPath();ctx.arc(rx,ry,4.4,0,7);ctx.fillStyle=rg0;ctx.fill();
 }
 // counter display mount arm
 ctx.strokeStyle='#4a515d';ctx.lineWidth=8;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(CNT.x+CNT.w-6,CNT.y+CNT.h/2);ctx.lineTo(200,CNT.y+CNT.h/2);ctx.stroke();
 // transport rail
 ctx.strokeStyle='#2c323c';ctx.lineWidth=36;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(PX,STACK.y-40);ctx.lineTo(PX,GATE.y-6);ctx.stroke();
 ctx.strokeStyle='#454d59';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(PX-18,STACK.y-40);ctx.lineTo(PX-18,GATE.y-6);ctx.stroke();
 ctx.beginPath();ctx.moveTo(PX+18,STACK.y-40);ctx.lineTo(PX+18,GATE.y-6);ctx.stroke();
 // guide rollers pairs along rail
 for(const gy of [620,500,330]){
  for(const dx of [-26,26]){
   ctx.beginPath();ctx.arc(PX+dx,gy,8,0,7);
   ctx.fillStyle=steel(PX+dx-8,gy-8,PX+dx+8,gy+8);ctx.fill();
   ctx.strokeStyle='#6a7482';ctx.lineWidth=1.2;ctx.stroke();
   ctx.save();ctx.translate(PX+dx,gy);ctx.rotate(t*10*(dx>0?-1:1));
   ctx.strokeStyle='rgba(20,24,30,0.8)';ctx.lineWidth=1.4;
   ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(5,0);ctx.stroke();ctx.restore();
  }
 }
 // feed stack
 ctx.save();ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=18;ctx.shadowOffsetY=8;
 rr(STACK.x-16,STACK.y+28,STACK.w+32,34,8);ctx.fillStyle=steel(0,STACK.y+28,0,STACK.y+62);ctx.fill();ctx.restore();
 const n=14;
 for(let k=0;k<n;k++){
  const yy=STACK.y+24-k*5.2, off=2.5*Math.sin(k*1.7);
  const g=ctx.createLinearGradient(0,yy-5,0,yy+5);
  g.addColorStop(0,'#c2d3bc');g.addColorStop(1,'#86997f');
  rr(STACK.x+off,yy-5,STACK.w-2*Math.abs(off),10,3);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(40,60,40,0.4)';ctx.lineWidth=0.8;
  rr(STACK.x+off,yy-5,STACK.w-2*Math.abs(off),10,3);ctx.stroke();
 }
 // friction roller (spinning)
 ctx.save();ctx.translate(ROLL.x,ROLL.y);ctx.rotate(-t*14);
 const rg=ctx.createRadialGradient(-6,-6,2,0,0,ROLL.r);
 rg.addColorStop(0,'#3a3f48');rg.addColorStop(1,'#15181d');
 ctx.beginPath();ctx.arc(0,0,ROLL.r,0,7);ctx.fillStyle=rg;ctx.fill();
 ctx.strokeStyle='#59616d';ctx.lineWidth=2;ctx.stroke();
 for(let k=0;k<8;k++){const a=k/8*6.283;
  ctx.strokeStyle='rgba(120,130,145,0.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(Math.cos(a)*(ROLL.r-9),Math.sin(a)*(ROLL.r-9));
  ctx.lineTo(Math.cos(a)*(ROLL.r-2),Math.sin(a)*(ROLL.r-2));ctx.stroke();}
 ctx.restore();
 // thickness pinch station
 for(const dx of [-30,30]){
  ctx.beginPath();ctx.arc(PX+dx,THK.y,14,0,7);
  ctx.fillStyle=steel(PX+dx-14,THK.y-14,PX+dx+14,THK.y+14);ctx.fill();
  ctx.strokeStyle='#79828f';ctx.lineWidth=1.6;ctx.stroke();
 }
 // thickness dial
 const anyDbl=currentAt(t,THK.y,isDouble);
 rr(PX+52,THK.y-34,92,56,10);ctx.fillStyle='#161a21';ctx.fill();
 rr(PX+52,THK.y-34,92,56,10);ctx.strokeStyle=anyDbl?'#ff5a40':'#4a525e';ctx.lineWidth=2;ctx.stroke();
 const lvl=anyDbl?0.95:0.38+0.04*Math.sin(t*9);
 for(let k=0;k<5;k++){
  const on=lvl>k/5;
  ctx.fillStyle=on?(k>=3?'#ff5a40':'#39e0ff'):'#262c35';
  rr(PX+62+k*16,THK.y-24,11,36,2);ctx.fill();
 }
 // optical scan station
 rr(PX-96,OPT.y-18,58,36,8);ctx.fillStyle=steel(0,OPT.y-18,0,OPT.y+18);ctx.fill();
 rr(PX-96,OPT.y-18,58,36,8);ctx.strokeStyle='#79828f';ctx.lineWidth=1.6;ctx.stroke();
 const sweep=(t*2.4)%1;
 ctx.save();ctx.globalCompositeOperation='lighter';
 const bg2=ctx.createLinearGradient(PX-38,0,PX+40,0);
 bg2.addColorStop(0,'rgba(120,220,255,0.45)');bg2.addColorStop(1,'rgba(120,220,255,0.05)');
 ctx.fillStyle=bg2;
 ctx.beginPath();ctx.moveTo(PX-38,OPT.y-3);ctx.lineTo(PX+42,OPT.y-14+sweep*28);ctx.lineTo(PX+42,OPT.y-6+sweep*28);ctx.lineTo(PX-38,OPT.y+3);ctx.closePath();ctx.fill();
 ctx.restore();
 // magnetic coil station
 ctx.strokeStyle='#c87f3a';ctx.lineWidth=4;
 for(let k=0;k<4;k++){
  ctx.beginPath();ctx.arc(PX+44,MAG.y,10+k*5,Math.PI*0.65,Math.PI*1.35);ctx.stroke();
 }
 const pulse=0.5+0.5*Math.sin(t*8);
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.35*pulse;
 ctx.strokeStyle='#ffc364';ctx.lineWidth=2;
 for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(PX+44,MAG.y,28+k*8,Math.PI*0.7,Math.PI*1.3);ctx.stroke();}
 ctx.restore();
 // gate flap
 const rejNow=currentAt(t,GATE.y+26,(i)=>isDouble(i)||isFake(i));
 ctx.save();ctx.translate(PX,GATE.y);
 ctx.rotate(rejNow? 0.65 : -0.55);
 ctx.strokeStyle=rejNow?'#ff6a50':'#8d97a6';ctx.lineWidth=7;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-40);ctx.stroke();
 ctx.restore();
 // branch guide rails after gate (to output + to reject)
 ctx.strokeStyle='#454d59';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(PX-8,GATE.y-4);ctx.quadraticCurveTo(300,230,OUT.x+OUT.w-20,OUT.y+OUT.h-6);ctx.stroke();
 ctx.beginPath();ctx.moveTo(PX+8,GATE.y-4);ctx.quadraticCurveTo(410,230,REJ.x+16,REJ.y+REJ.h-8);ctx.stroke();
 // output tray
 ctx.save();ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=14;
 rr(OUT.x-12,OUT.y+OUT.h-12,OUT.w+24,26,8);ctx.fillStyle=steel(0,OUT.y+OUT.h-12,0,OUT.y+OUT.h+14);ctx.fill();ctx.restore();
 const done=Math.min(12,Math.floor(Math.max(0,(t-0.9))/SPAWN*0.86));
 for(let k=0;k<done;k++){
  const yy=OUT.y+OUT.h-18-k*4.6;
  const g=ctx.createLinearGradient(0,yy-4,0,yy+5);
  g.addColorStop(0,'#c2d3bc');g.addColorStop(1,'#86997f');
  rr(OUT.x+3*Math.sin(k*2.1),yy-4,OUT.w-14,9,3);ctx.fillStyle=g;ctx.fill();
 }
 // reject bin
 rr(REJ.x,REJ.y,REJ.w,REJ.h,10);ctx.fillStyle='#1a1116';ctx.fill();
 rr(REJ.x,REJ.y,REJ.w,REJ.h,10);ctx.strokeStyle='#8d3a30';ctx.lineWidth=2.4;ctx.stroke();
 ctx.fillStyle='rgba(255,90,60,0.12)';rr(REJ.x+4,REJ.y+4,REJ.w-8,REJ.h-8,8);ctx.fill();
 const rejCount=Math.floor(Math.max(0,t-1.6)/ (SPAWN*7) )+ (t>3? Math.floor(Math.max(0,t-2.2)/(SPAWN*11)):0);
 for(let k=0;k<Math.min(4,rejCount);k++){
  note(REJ.x+REJ.w/2, REJ.y+REJ.h-22-k*11, 0.09*(k%2?-1:1), false, true, false);
 }
 // counter display
 ctx.save();ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=14;
 rr(CNT.x,CNT.y,CNT.w,CNT.h,12);ctx.fillStyle='#10141b';ctx.fill();ctx.restore();
 rr(CNT.x,CNT.y,CNT.w,CNT.h,12);ctx.strokeStyle='#4a525e';ctx.lineWidth=2;ctx.stroke();
 const cnt=Math.min(100,Math.floor(Math.max(0,(t-0.9))/SPAWN*0.86)+ (t>14? Math.floor((t-14)*30):0));
 ctx.font='44px MontB';ctx.textAlign='right';ctx.textBaseline='middle';
 ctx.save();ctx.shadowColor='rgba(80,220,255,0.8)';ctx.shadowBlur=12;
 ctx.fillStyle='#4ee6ff';ctx.fillText(String(cnt).padStart(3,'0'),CNT.x+CNT.w-18,CNT.y+CNT.h/2+2);
 ctx.restore();
}
// is there a note of predicate type within +-20px of y right now?
function currentAt(t,yy,pred){
 for(let i=0;i<60;i++){
  const p=notePos(t,i);
  if(!p)continue;
  if(Math.abs(p.y-yy)<22 && pred(i)) return true;
 }
 return false;
}
function notes(t){
 for(let i=0;i<60;i++){
  const p=notePos(t,i);
  if(!p)continue;
  const glow=(Math.abs(p.y-OPT.y)<26);
  note(p.x,p.y,p.ang,isDouble(i),(isFake(i)&&p.y<OPT.y+10)||p.st==='rej'&&isFake(i),glow);
 }
}
function post(t){
 const v=ctx.createRadialGradient(W/2,H*0.46,220,W/2,H*0.52,760);
 v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.55)');
 ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
window.renderAt=function(t){
 ctx.setTransform(2,0,0,2,0,0);
 bg(t);
 const c=camera(t);
 ctx.save();
 ctx.translate(W/2,H/2);ctx.scale(c.z,c.z);ctx.translate(-c.cx,-c.cy);
 machine(t);
 notes(t);
 ctx.restore();
 post(t);
 return true;
};
const f1=new FontFace('MontB','url(file:///home/user/explainer-pipeline/assets/fonts/Montserrat-Black.ttf)');
f1.load().then(f=>{document.fonts.add(f);window.READY=true;});
</script></body></html>
