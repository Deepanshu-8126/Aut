<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'InterBlack';src:url('../fonts/Inter-Black.ttf')}
html,body{margin:0;padding:0;background:#000}
#c{width:540px;height:960px;display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=540,H=960,OUT='#141414',IMP=10.80;
function R(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function ez(u){u=clamp(u,0,1);return u*u*(3-2*u);}
const IM={};let sl=0;const SN=5;
[['bg','bg_recon.png?v=14'],['gp','ng_punch_cut.png'],['gi','ng_idle_cut.png'],
 ['bf','sp_bat_fly_cut.png'],['bc','sp_bat_crashed_cut.png']].forEach(([k,f])=>{
 const im=new Image();im.onload=()=>{sl++;};im.src=f+'?v=1';IM[k]=im;});
function spr(im,cx,baseY,h,rot,alpha,mode,sx,sy){
 const sc=h/im.height,w=im.width*sc;
 ctx.save();ctx.globalAlpha=(alpha===undefined?1:alpha);
 ctx.translate(cx,baseY);ctx.rotate(rot||0);ctx.scale(sx||1,sy||1);
 if(mode===1)ctx.drawImage(im,-w/2,-h/2,w,h);else ctx.drawImage(im,-w/2,-h,w,h);
 ctx.restore();ctx.globalAlpha=1;}
function shad(x,wd,y){ctx.fillStyle='rgba(0,0,0,0.28)';ctx.beginPath();ctx.ellipse(x,(y||786),wd,wd*0.16,0,0,7);ctx.fill();}
function burst(x,y,r,txt){ctx.save();ctx.translate(x,y);
 ctx.fillStyle='#ffd23e';ctx.strokeStyle=OUT;ctx.lineWidth=7;ctx.beginPath();
 for(let i=0;i<12;i++){const a=i/12*Math.PI*2,rr=(i%2?r:r*0.55);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
 ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle=OUT;ctx.font=(r*0.34)+'px InterBlack';ctx.textAlign='center';ctx.fillText(txt,0,r*0.12);ctx.restore();}
function dust(x,y,n,seed,sp){for(let i=0;i<n;i++){
 ctx.fillStyle='rgba(180,160,135,'+(0.5*(1-sp))+')';
 ctx.beginPath();ctx.arc(x+(R(seed+i)-0.5)*90*(0.4+sp),y-sp*60*R(seed+i+9),8+14*R(seed+i+4)*(1-sp*0.4),0,7);ctx.fill();}}
// code-drawn props (comic outline style)
function drawProp(kind,x,y,rot,h){
 ctx.save();ctx.translate(x,y);ctx.rotate(rot);const s=h/60;ctx.scale(s,s);
 ctx.lineWidth=5;ctx.strokeStyle=OUT;
 if(kind===0){ // dumbbell
  ctx.fillStyle='#4a4e57';ctx.beginPath();ctx.roundRect(-26,-5,52,10,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#2e3138';
  ctx.beginPath();ctx.roundRect(-34,-16,12,32,5);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.roundRect(22,-16,12,32,5);ctx.fill();ctx.stroke();}
 else if(kind===1){ // plate
  ctx.fillStyle='#3a3f45';ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#23262b';ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#6b6f78';ctx.beginPath();ctx.arc(0,0,6,0,7);ctx.fill();ctx.stroke();}
 else{ // kettlebell
  ctx.fillStyle='#d8352a';ctx.beginPath();ctx.arc(0,6,20,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='none';ctx.beginPath();ctx.arc(0,-14,11,Math.PI*0.9,Math.PI*2.1);
  ctx.lineWidth=9;ctx.stroke();ctx.lineWidth=5;ctx.strokeStyle='#8a2019';
  ctx.beginPath();ctx.arc(0,-14,11,Math.PI*0.95,Math.PI*2.05);ctx.stroke();ctx.strokeStyle=OUT;}
 ctx.restore();}
function propfly(dt){
 const ps=[[0,470,768,0.9,66],[2,514,788,1.2,62],[1,446,806,0.75,56]];
 ps.forEach((p,i)=>{const u=clamp(dt*p[3],0,1);
  const x=p[1]+(i-1)*46*u,y=p[2]-120*Math.sin(u*Math.PI)*(1-i*0.12);
  drawProp(p[0],x,y,u*(5-i*1.6)*(i%2?1:-1),p[4]);});}
window.renderAt=function(t){window._t=t;
 ctx.save();ctx.scale(2,2);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 let zoom=1,cx=300,cy=560,rot=0,shx=0,shy=0;
 const sh=(a,f)=>{shx+=(R(Math.floor(t*f))-0.5)*a;shy+=(R(Math.floor(t*f)+7)-0.5)*a;};
 if(t<11.05){zoom=1.58;cx=372;cy=600;rot=-0.02;const k=Math.exp(-(t-10.8)*9);sh(30*k,90);}
 else if(t<11.78){const u=(t-11.05)/0.73;zoom=1.58-0.16*ez(u);cx=372+28*ez(u);cy=600+34*ez(u);const k=Math.exp(-(t-10.8)*5);sh(12*k,80);}
 else if(t<12.10){zoom=1.42;cx=400;cy=640;sh(1.5,50);}
 else{const u=(t-12.1)/1.7;zoom=1.5-0.32*ez(u);cx=262+40*ez(u);cy=655-55*ez(u);rot=0.02*(1-ez(u));sh(1.2,45);}
 shx+=1.1*Math.sin(t*1.3)+0.8*Math.sin(t*2.7);shy+=0.8*Math.sin(t*1.7+1);
 ctx.save();ctx.translate(W/2,H/2);ctx.rotate(rot);ctx.scale(zoom,zoom);ctx.translate(-cx+shx,-cy+shy);
 ctx.drawImage(IM.bg,-60,-111.25,660,1182.5);
 // HULK: clean punch sprite hold -> straighten to idle sprite
 let HX=185+32*ez(clamp((t-10.8)/0.2,0,1));
 shad(HX,115);
 if(t<12.52){const es=1+0.10*Math.exp(-(t-10.8)*5)*Math.sin((t-10.8)*22);
  const ga=(t<12.3)?1:1-ez((t-12.3)/0.22);
  spr(IM.gp,HX,775,302,0.015*Math.sin(t*2),ga,0,1,es);}
 if(t>=12.3){const gb=ez((t-12.3)/0.22);
  const brth=1+0.012*Math.sin(t*1.2)+0.035*Math.exp(-(t-12.3)*1.1)*Math.max(0,Math.sin((t-12.3)*7));
  spr(IM.gi,240,775,300,0.012*Math.sin(t*1.2),gb,0,1,brth);}
 // BATMAN: fly -> land -> slide
 if(t<11.78){const u2=clamp((t-10.80)/0.95,0,1);
  const fx=Math.min(396+96*u2,486),fy=720-285*Math.sin(Math.PI*clamp((t-10.82)/0.93,0,1));
  shad(fx,70,796);
  spr(IM.bf,fx,fy,210,(t-10.8)*0.9,1,1,(t-10.8)<0.08?1.3:1,(t-10.8)<0.08?0.8:1);}
 else{let bcy=792,q=1,bx=486;
  const k=t-11.78;
  if(k<0.22){bcy=792-40*Math.sin(Math.PI*k/0.22);q=(k<0.03||k>0.19)?0.8:1;}
  else{bx=486+14*ez(clamp((t-11.97)/0.48,0,1));
   if(t>11.98&&t<12.5)dust(bx-20,790,4,8,clamp((t-11.98)/0.5,0,1));}
  shad(500,100,796);spr(IM.bc,bx,bcy-34,120,0.06,1,1,1,q);}
 // impact FX
 if(t<12.2){const dt=t-10.80;
  if(dt<0.22){for(let i=0;i<7;i++){const a=i/7*6.28+0.3;
   ctx.strokeStyle='rgba(255,255,255,'+(0.5*(1-dt/0.22))+')';ctx.lineWidth=4;
   ctx.beginPath();ctx.moveTo(398+Math.cos(a)*40,586+Math.sin(a)*40);
   ctx.lineTo(398+Math.cos(a)*(150+300*dt),586+Math.sin(a)*(150+300*dt));ctx.stroke();}}
  if(dt<0.3){ctx.save();ctx.globalCompositeOperation='lighter';
   for(let w2=0;w2<2;w2++){const k3=clamp((dt-w2*0.05)/0.25,0,1);
    if(k3>0&&k3<1){ctx.strokeStyle='rgba(190,255,170,'+(0.8*(1-k3))+')';ctx.lineWidth=16*(1-k3)+3;
     ctx.beginPath();ctx.arc(398,586,30+k3*430,0,7);ctx.stroke();}}
   ctx.restore();}
  for(let i=0;i<8;i++){const vx=(R(i+20)-0.3)*420,vy=-320*R(i+30)-80,gx=398+vx*dt,gy=600+vy*dt+450*dt*dt;
   if(gy<800){ctx.save();ctx.translate(gx,gy);ctx.rotate(dt*(4+6*R(i)));
    ctx.fillStyle=i%2?'#6b6f78':'#8a7a62';ctx.fillRect(-5,-4,10+6*R(i+9),8);ctx.restore();}}
  dust(430,760,8,3,clamp(dt/1.3,0,1));
  if(dt<0.45)burst(400,580,66-30*dt,'KRAKK!!');}
 if(t<12.6)propfly(clamp(t-10.80,0,1.6));
 ctx.restore();
 if(t<IMP+0.067){ctx.fillStyle='rgba(255,255,255,0.93)';ctx.fillRect(0,0,W,H);}
 for(let i=0;i<40;i++){const x=(R(i+40)*W+t*37)%W,y=(R(i+80)*H-t*53+H)%H;
  ctx.globalAlpha=0.04;ctx.fillStyle='#000';ctx.fillRect(x,y,2,2);}
 ctx.globalAlpha=1;ctx.restore();
};
(async()=>{await document.fonts.load('30px InterBlack');await document.fonts.ready;
 const chk=()=>{if(sl>=SN)window.READY=true;else setTimeout(chk,50);};chk();})();
</script></body></html>
