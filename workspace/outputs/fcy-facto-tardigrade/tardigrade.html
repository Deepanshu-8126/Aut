<!DOCTYPE html><html><head><meta charset="utf-8"><style>

@font-face{font-family:'Bangers';src:url('file:///home/user/explainer-pipeline/assets/fonts/Bangers.ttf');}

</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=540,H=960,YEL='#FFD400',DIR='file:///home/user/outputs/fcy-facto-tardigrade/';
const SRC={space:'BR_SPACE.jpg',rocket:'BR_ROCKET.jpg',moss:'BR_MOSS.jpg',ice:'BR_ICE.jpg',
sem:'real-photos/REAL_SEM.jpg',tun:'real-photos/REAL_TUN.jpg',biopan:'real-photos/REAL_BIOPAN.jpg',eggs:'real-photos/REAL_EGGS.jpg',
mm:'../fcy-facto-test/sprites/MASCOT_MAIN.png',ms:'../fcy-facto-test/sprites/M_SHOCK.png',mb:'../fcy-facto-test/sprites/M_BLOWN.png'};
const IMG={};let loaded=0,total=Object.keys(SRC).length;
function maybeReady(){if(loaded==total&&window.FONTSOK)window.READY=1;}
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px InterBlack'),document.fonts.load('30px InterBold'),document.fonts.load('80px Bangers'),document.fonts.load('80px MontBlack')]).then(()=>{window.FONTSOK=1;maybeReady();});
for(const k in SRC){IMG[k]=new Image();IMG[k].onload=()=>{loaded++;maybeReady();};IMG[k].src=DIR+SRC[k];}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eo=p=>1-Math.pow(1-clamp(p,0,1),3);
function cover(img,z,px,py){const iw=img.width,ih=img.height;const s=Math.max(W/iw,H/ih)*z;
 const dw=iw*s,dh=ih*s;ctx.drawImage(img,W/2-dw/2+px*(dw-W)/2,H/2-dh/2+py*(dh-H)/2,dw,dh);}
function shake(t,amp,f){return[amp*Math.sin(t*f*6.28+1.7)*Math.sin(t*f*4.1),amp*Math.sin(t*f*5.9)*Math.cos(t*f*3.3)];}
function pop(tl,d=0.16){if(tl<0)return{s:0,a:0};const p=clamp(tl/d,0,1);return{s:1.7-0.7*eo(p),a:eo(p)};}
function bigText(txt,x,y,size,tl,col=YEL,font='Anton'){
 if(tl<0)return; const d=0.15,p=clamp(tl/d,0,1);
 const sc=(0.82+0.18*eo(p))*(1+0.006*Math.sin(tl*2.6));
 ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.globalAlpha=Math.min(1,p*1.8);
 ctx.font=size+'px MontBlack';ctx.textAlign='center';ctx.textBaseline='middle';
 const mw=ctx.measureText(txt).width,fit=Math.min(1,496/mw);ctx.scale(fit,fit);
 const C=(col===YEL)?'#FFE600':col;
 ctx.shadowColor='rgba(0,0,0,0.95)';ctx.shadowBlur=size*0.16;ctx.shadowOffsetY=size*0.03;
 ctx.fillStyle=C;ctx.fillText(txt,0,0);ctx.fillText(txt,0,0);
 ctx.shadowBlur=size*0.05;ctx.fillText(txt,0,0);
 ctx.restore();}
function nameLabel(t1,t2,x,y,size,tl){
 if(tl<0)return; const p=clamp(tl/0.15,0,1);
 ctx.save();ctx.translate(x,y);ctx.globalAlpha=p;ctx.transform(1,0,-0.18,1,0,0);
 ctx.font=size+'px MontBlack';ctx.textAlign='left';ctx.textBaseline='middle';
 ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=size*0.3;ctx.shadowOffsetY=2;
 ctx.fillStyle='#fff';ctx.fillText(t1,0,0);
 const w=ctx.measureText(t1).width;
 ctx.fillStyle='#FFE600';ctx.fillText(t2,w+size*0.25,0);ctx.restore();}
function sprite(img,cx,cy,h,rot=0){const s=h/img.height,w=img.width*s;
 ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();}
function spritePop(img,cx,cy,h,tl,rot=0){const P=pop(tl,0.2);if(P.a<=0)return;
 ctx.save();ctx.globalAlpha=P.a;sprite(img,cx,cy,h*(2-P.s),rot+Math.sin(tl*3)*0.03);ctx.restore();}
function darkBG(g1='#0b0e16',g2='#141a28'){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,g1);g.addColorStop(1,g2);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function radial(x,y,r,col){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function flash(a){if(a>0){ctx.fillStyle='rgba(255,255,255,'+clamp(a,0,1)+')';ctx.fillRect(0,0,W,H);}}
function strike(x1,y1,x2,y2,p,col='#ff2b2b',w=10){if(p<=0)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1+(x2-x1)*eo(p),y1+(y2-y1)*eo(p));ctx.stroke();ctx.restore();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function jcover(img,lt,step,z0,dz,px,py){const k=Math.floor(lt/step);cover(img,z0+(k%2?dz:0)+lt*0.02,px,py);}
// NEW DEVICE 1: radiation warning triangle
function warnTri(x,y,s,tl){const P=pop(tl,0.2);if(P.a<=0)return;ctx.save();ctx.globalAlpha=P.a;ctx.translate(x,y);ctx.scale(s*P.s,s*P.s);
 ctx.fillStyle=YEL;ctx.strokeStyle='#000';ctx.lineWidth=7;
 ctx.beginPath();ctx.moveTo(0,-95);ctx.lineTo(105,75);ctx.lineTo(-105,75);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,18,16,0,6.3);ctx.fill();
 for(let i=0;i<3;i++){ctx.save();ctx.translate(0,18);ctx.rotate(1.57+i*2.094);
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,52,-0.42,0.42);ctx.closePath();ctx.fill();ctx.restore();}
 ctx.restore();}
// NEW DEVICE 2: water drop + ripple (tap moment)
function drop(t0,cx,cy){if(t0<0)return;
 const fall=clamp(t0/0.45,0,1);const dy=-320+eo(fall)*320;
 if(fall<1){ctx.save();ctx.fillStyle='#9fd8ff';ctx.beginPath();ctx.ellipse(cx,cy+dy,13,20,0,0,6.3);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.65)';ctx.beginPath();ctx.ellipse(cx-4,cy+dy-6,4,7,0,0,6.3);ctx.fill();ctx.restore();}
 else{const r=t0-0.45;
  for(let k=0;k<3;k++){const rp=clamp((r-k*0.18)/0.9,0,1);if(rp<=0)continue;
   ctx.save();ctx.globalAlpha=(1-rp)*0.8;ctx.strokeStyle='#9fd8ff';ctx.lineWidth=5-k;
   ctx.beginPath();ctx.ellipse(cx,cy,30+rp*210,(30+rp*210)*0.38,0,0,6.3);ctx.stroke();ctx.restore();}}}
function chrome(t){
 ctx.strokeStyle=YEL;ctx.lineWidth=10;ctx.strokeRect(5,5,W-10,H-10);
 const bob=Math.sin(t*2.1)*1.2;const bw=430,bx=W/2,by=40+bob;
 ctx.save();ctx.fillStyle='#000';ctx.strokeStyle=YEL;ctx.lineWidth=3;
 rr(bx-bw/2,by-22,bw,44,22);ctx.fill();ctx.stroke();
 ctx.font='24px Bangers';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillStyle='#fff';ctx.fillText("THE ALIEN ALREADY ON EARTH",bx-12,by+1);
 ctx.fillStyle=YEL;ctx.font='28px Bangers';ctx.fillText('?!',bx+196,by+1);ctx.restore();
 ctx.save();ctx.fillStyle='#000';rr(18,76+bob*0.5,128,30,15);ctx.fill();
 ctx.strokeStyle=YEL;ctx.lineWidth=2.5;rr(18,76+bob*0.5,128,30,15);ctx.stroke();
 ctx.font='20px Bangers';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=YEL;
 ctx.fillText('FUNCYOUS',30,92+bob*0.5);ctx.restore();}
function fitBear(z,py,glow){
 darkBG('#070a12','#10141f');radial(W/2,H*0.47,440,glow||'rgba(120,180,255,0.16)');
 const iw=IMG.sem.width,ih=IMG.sem.height;const s=(W*0.96/iw)*z;
 const dw=iw*s,dh=ih*s;
 ctx.save();ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=28;ctx.shadowOffsetY=10;
 ctx.drawImage(IMG.sem,W/2-dw/2,H*0.47-dh/2+(py||0),dw,dh);ctx.restore();}
function hookCard(lt,t){cover(IMG.space,1.34-0.18*eo(lt/0.65),0,-0.15);
 ctx.fillStyle='rgba(0,0,0,0.42)';ctx.fillRect(0,0,W,H);
 bigText('2007:',W/2,330,66,lt+0.07,'#fff','InterBlack');
 bigText('THEY THREW AN ANIMAL',W/2,430,46,lt+0.06);
 bigText('INTO OPEN SPACE',W/2,510,54,lt+0.02);}
window.renderAt=function(t){
 ctx.save();ctx.clearRect(0,0,cv.width,cv.height);ctx.scale(2,2);
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 const S=(a,b)=>t>=a&&t<b; const L=a=>t-a; let sx=0,sy=0;
 // ===== C1 HOOK 0.15-8.08 =====
 if(S(0,0.68)){hookCard(L(0),t);[sx,sy]=shake(t,6*(1-L(0)/0.68),9);}
 else if(S(0.68,2.7)){cover(IMG.rocket,1.12+0.3*(L(0.68)/2.0),0,0.2-0.5*(L(0.68)/2.0));
  bigText('A LIVING ANIMAL',W/2,430,50,L(1.0));flash(clamp(1-L(0.68)/0.14,0,1)*0.7);[sx,sy]=shake(t,4*(1-L(0.68)/2.0),8);}
 else if(S(2.7,3.85)){cover(IMG.space,1.1+0.16*(L(2.7)/1.15),0.6,0);bigText('INTO OPEN SPACE',W/2,760,50,L(2.78));flash(clamp(1-L(2.7)/0.12,0,1)*0.5);}
 else if(S(3.85,6.1)){darkBG('#070a12','#10141f');radial(W/2,400,420,'rgba(80,120,255,0.14)');
  bigText('NO SUIT.',W/2,360,62,L(3.9));
  bigText('NO AIR.',W/2,470,62,L(4.55));
  bigText('NO PROTECTION.',W/2,580,56,L(5.15),'#ff4b4b');
  spritePop(IMG.ms,W/2,800,250,L(5.2));[sx,sy]=shake(t,L(5.15)>0?3:0,9);}
 else if(S(6.1,7.25)){ctx.fillStyle='#030406';ctx.fillRect(0,0,W,H);
  bigText('10 DAYS LATER...',W/2,480,46,L(6.2),'#fff','InterBlack');}
 else if(S(7.25,8.18)){fitBear(1.22-0.22*eo(L(7.25)/0.5),0);flash(clamp(1-L(7.25)/0.16,0,1));
  bigText('IT WOKE UP.',W/2,790,64,L(7.4));[sx,sy]=shake(t,5*(1-L(7.25)/0.93),10);}
 // ===== C2 INTRO 8.18-20.72 =====

  nameLabel('The','TARDIGRADE',70,820,50,L(8.5));}
 else if(S(9.9,11.3)){fitBear(0.8+0.05*(L(9.9)/1.4),-60);

 else if(S(13.85,15.45)){cover(IMG.ice,1.28-0.14*eo(L(13.85)/1.6),0,-0.1);
  bigText('FROZEN 30 YEARS?',W/2,420,52,L(13.95));}
 else if(S(15.45,16.35)){cover(IMG.ice,1.16,0,0.2);flash(clamp(1-L(15.45)/0.14,0,1)*0.8);
  bigText('WAKES UP.',W/2,480,76,L(15.5));[sx,sy]=shake(t,4*(1-L(15.45)/0.9),10);}
 else if(S(16.35,17.75)){fitBear(1.05,40,'rgba(255,90,10,0.3)');radial(W/2,H*0.5,480,'rgba(255,90,10,0.18)');
  bigText('BOILED?',W/2,250,66,L(16.45),'#ff7a2b');bigText('SURVIVES.',W/2,790,62,L(16.95));}
 else if(S(17.75,20.82)){darkBG('#131003','#1d1805');radial(W/2,370,420,'rgba(255,212,0,0.22)');
  warnTri(W/2,340,1.0,L(17.8));
  bigText('RADIATION?',W/2,540,54,L(17.95));

  [sx,sy]=shake(t,L(19.55)>0?3.5:0,9);}
 // ===== C3 ESCALATION 20.82-35.56 =====
 else if(S(20.82,24.4)){cover(IMG.biopan,1.3-0.15*eo(L(20.82)/3.6),0,-0.3);
  nameLabel('ESA','SPACE AGENCY',70,170,38,L(21.2));
  bigText('3,000 OF THEM',W/2,780,54,L(22.85));flash(clamp(1-L(20.82)/0.12,0,1)*0.5);}
 else if(S(24.4,25.9)){cover(IMG.rocket,1.45-0.2*eo(L(24.4)/1.5),-0.3,-0.4);
  bigText('BOLTED OUTSIDE',W/2,420,54,L(24.5));bigText('THE ROCKET',W/2,505,50,L(24.75));}
 else if(S(25.9,27.9)){cover(IMG.space,1.08+0.2*(L(25.9)/2.0),0.7,-0.1);
  bigText('10 DAYS',W/2,400,80,L(26.0));bigText('IN THE VACUUM',W/2,510,48,L(26.35));}
 else if(S(27.9,30.5)){darkBG('#12070a','#1c0d12');radial(W/2,430,430,'rgba(255,40,40,0.16)');
  bigText('A HUMAN?',W/2,380,62,L(28.0),'#fff','InterBlack');
  bigText('DEAD IN 15 SECONDS.',W/2,490,50,L(28.7),'#ff4b4b');
  spritePop(IMG.ms,W/2,760,260,L(28.8));[sx,sy]=shake(t,L(28.7)>0?3:0,8);}
 else if(S(30.5,31.6)){cover(IMG.biopan,1.12,0,0.4);ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
  bigText('THEY CAME BACK.',W/2,470,46,L(30.6),'#fff','InterBlack');}
 else if(S(31.6,33.65)){ctx.fillStyle='#04070c';ctx.fillRect(0,0,W,H);radial(W/2,560,320,'rgba(90,160,255,0.18)');
  drop(L(31.9),W/2,560);
  bigText('ONE DROP',W/2,330,64,L(32.45));bigText('OF WATER.',W/2,430,58,L(32.8));}
 else if(S(33.65,34.55)){fitBear(1.18-0.18*eo(L(33.65)/0.5),0);flash(clamp(1-L(33.65)/0.16,0,1));
  bigText('THEY WOKE UP.',W/2,790,58,L(33.7));[sx,sy]=shake(t,5*(1-L(33.65)/0.9),10);}
 else if(S(34.55,35.78)){cover(IMG.eggs,1.3-0.15*eo(L(34.55)/1.2),0,0);

 // ===== C4 PAYOFF 35.78-45.58 =====
 else if(S(35.78,37.55)){darkBG();radial(W/2,450,400,'rgba(255,212,0,0.2)');

 else if(S(37.55,39.75)){cover(IMG.sem,1.2+0.06*(L(37.55)/2.2),-0.3,-0.2);ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);

 else if(S(39.75,42.35)){darkBG('#0a1208','#12200e');radial(W/2,420,430,'rgba(120,255,120,0.12)');
  const n=Math.floor(500000000*eo(L(39.85)/0.8));

  bigText('YEARS ON EARTH',W/2,530,50,L(41.0));
  flash(L(39.85)>0.8?clamp((L(39.85)-0.8)/0.06,0,1)*clamp(1-(L(39.85)-0.8)/0.25,0,1)*0.5:0);
  [sx,sy]=shake(t,L(41.0)>0?2.5:0,8);}
 else if(S(42.35,44.95)){cover(IMG.moss,1.3-0.16*eo(L(42.35)/2.6),0,0.2);

 else {flash(clamp(1-L(44.95)/0.1,0,1)*0.4);hookCard(0.03,t);}
 ctx.restore();
 ctx.save();ctx.scale(2,2);
 chrome(t);
 const vg=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.75);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.32)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 ctx.restore();
};
