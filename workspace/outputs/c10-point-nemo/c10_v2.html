<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'OswaldB';src:url('../../explainer-pipeline/assets/fonts/Oswald-Bold.ttf');}
@font-face{font-family:'Mono';src:url('../../explainer-pipeline/assets/fonts/JetBrainsMono-Bold.ttf');}
@font-face{font-family:'Elite';src:url('../../explainer-pipeline/assets/fonts/SpecialElite.ttf');}
@font-face{font-family:'Marker';src:url('../../explainer-pipeline/assets/fonts/PermanentMarker.ttf');}
html,body{margin:0;padding:0;background:#000;}
canvas{display:block;width:540px;height:960px;margin:auto;}
</style></head><body><canvas id="cv" width="1080" height="1920"></canvas><script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=540,H=960;
// VI palette (Visual Investigation — lemo-opuscar chronic_visual-investigation.md)
const GND='#0B0C0E',PAN='#141619',HAIR='#2E3238',TXT='#ECEAE4',SEC='#8B9097';
const RED='#FF4A2E',AMB='#E8B44A'; // red = only accent colour (VI law); AMB = dossier amber
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eo=t=>1-Math.pow(1-clamp(t,0,1),3);
const ei=t=>Math.pow(clamp(t,0,1),3);
const lerp=(a,b,t)=>a+(b-a)*t;

// ── IMAGE SOURCES ──────────────────────────────────────────────────────────────
const SRC={
  hero:'shots/THUMB_C10.jpg',
  map:'shots/MAP_POINT_NEMO.jpg',
  space:'shots/SPACE_ORBIT.jpg',
  spectro:'shots/BLOOP_SPECTROGRAM.jpg',
  ice:'shots/ICEQUAKE.jpg'
};
const IMG={};let loaded=0;
window.READY=0;window.FONTSOK=0;
const total=Object.keys(SRC).length;
function maybeReady(){if(loaded>=total&&window.FONTSOK)window.READY=1;}
for(const k in SRC){
  IMG[k]=new Image();
  IMG[k].onload=()=>{loaded++;maybeReady();};
  IMG[k].onerror=()=>{loaded++;maybeReady();};
  IMG[k].src=SRC[k];
}
Promise.all([
  document.fonts.load('80px OswaldB'),
  document.fonts.load('30px Mono'),
  document.fonts.load('20px Elite'),
  document.fonts.load('20px Marker')
]).then(()=>{window.FONTSOK=1;maybeReady();});

// ── TEXTURES ───────────────────────────────────────────────────────────────────
// Film grain (35mm)
const nz=document.createElement('canvas');nz.width=270;nz.height=480;
{const c2=nz.getContext('2d'),d=c2.createImageData(270,480);
 for(let i=0;i<d.data.length;i+=4){const v=110+Math.random()*130;
  d.data[i]=v;d.data[i+1]=v;d.data[i+2]=v;d.data[i+3]=20;}
 c2.putImageData(d,0,0);}

// Stamp erosion mask
const iz=document.createElement('canvas');iz.width=270;iz.height=480;
{const c2=iz.getContext('2d'),d=c2.createImageData(270,480);
 for(let i=0;i<d.data.length;i+=4){d.data[i]=255;d.data[i+1]=255;d.data[i+2]=255;
  d.data[i+3]=(Math.random()<0.26)?(80+Math.random()*175):0;}
 c2.putImageData(d,0,0);}

// ── UTILS ──────────────────────────────────────────────────────────────────────
function dk(a){ctx.fillStyle='rgba(0,0,0,'+a+')';ctx.fillRect(0,0,W,H);}

function cover(img,z=1,px=0,py=0){
  if(!img||!img.width)return;
  const iw=img.width,ih=img.height,s=Math.max(W/iw,H/ih)*z;
  const w=iw*s,h=ih*s;
  ctx.drawImage(img,(W-w)/2+px*(w-W)/2,(H-h)/2+py*(h-H)/2,w,h);
}

// VI grade: grayscale + contrast for evidence photos
function coverVI(img,z=1,px=0,py=0,alpha=1){
  if(!img||!img.width)return;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.filter='grayscale(1) contrast(1.22) brightness(0.94)';
  cover(img,z,px,py);
  ctx.filter='none';
  ctx.restore();
}

// Film grain overlay (VI law: grain on sources only)
function grain(t){
  const fs=Math.floor(t*30);let gs=(fs*9301+49297)%233280;
  ctx.save();ctx.globalAlpha=0.09;ctx.fillStyle='#fff';
  for(let i=0;i<80;i++){gs=(gs*9301+49297)%233280;const gx=(gs/233280)*W;
   gs=(gs*9301+49297)%233280;ctx.fillRect(gx,(gs/233280)*H,2,2);}
  ctx.globalAlpha=0.06;ctx.fillStyle='#000';
  for(let i=0;i<60;i++){gs=(gs*9301+49297)%233280;const gx=(gs/233280)*W;
   gs=(gs*9301+49297)%233280;ctx.fillRect(gx,(gs/233280)*H,2,2);}
  ctx.restore();
}

// Vignette + warm tint (post-process)
function post(){
  const g=ctx.createRadialGradient(W/2,H/2,H*0.28,W/2,H/2,H*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.62)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(232,180,74,0.03)';ctx.fillRect(0,0,W,H);
}

// White flash cut-in (VI law: elements cut in ≤0.1s with white flash)
function flash(tl,dur=0.08){
  if(tl<0||tl>dur)return;
  const a=0.35*(1-tl/dur);
  ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fillRect(0,0,W,H);
}

// Organic camera sway (handheld)
function sway(t){
  const swx=2.1*Math.sin(t*2.1)+0.7*Math.sin(t*7.3);
  const swy=1.7*Math.cos(t*1.7)+0.6*Math.cos(t*6.1);
  ctx.translate(W/2+swx,H/2+swy);ctx.scale(1.014,1.014);
  ctx.rotate(0.002*Math.sin(t*0.9));ctx.translate(-W/2,-H/2);
}

// ── TYPE FUNCTIONS ─────────────────────────────────────────────────────────────
function big(txt,y,size,tl,col=TXT){
  if(tl<0)return;
  const p=clamp(tl/0.13,0,1);
  const txf=(window.TXF===undefined)?1:window.TXF;
  ctx.save();ctx.translate(W/2,y);
  ctx.scale(0.87+0.13*eo(p),0.87+0.13*eo(p));
  ctx.globalAlpha=Math.min(1,p*1.8)*txf;
  ctx.font=size+'px OswaldB';ctx.textAlign='center';ctx.textBaseline='middle';
  const mw=ctx.measureText(txt).width,fit=Math.min(1,500/mw);ctx.scale(fit,fit);
  ctx.shadowColor='rgba(0,0,0,0.95)';ctx.shadowBlur=size*0.22;ctx.shadowOffsetY=3;
  ctx.fillStyle=col;ctx.fillText(txt,0,0);ctx.fillText(txt,0,0);ctx.restore();
}

function sub(txt,y,tl,col=AMB){
  if(tl<0)return;
  const p=clamp(tl/0.15,0,1);
  const txf=(window.TXF===undefined)?1:window.TXF;
  ctx.save();ctx.globalAlpha=p*0.9*txf;
  ctx.font='16px Elite';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=6;
  ctx.fillStyle=col;ctx.fillText(txt,W/2,y);ctx.restore();
}

function mono(txt,x,y,size,tl,col=SEC){
  if(tl<0)return;
  const p=clamp(tl/0.12,0,1);
  const txf=(window.TXF===undefined)?1:window.TXF;
  ctx.save();ctx.globalAlpha=p*txf;
  ctx.font=`${size}px Mono`;ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillStyle=col;ctx.fillText(txt,x,y);ctx.restore();
}

// ── STAMP (double-strike eroded rubber stamp) ──────────────────────────────────
function stamp(txt,x,y,rot,tl,size=26,col=RED){
  if(tl<0)return;
  const p=clamp(tl/0.12,0,1);
  const sc=2.2-1.2*eo(p);
  const txf=(window.TXF===undefined)?1:window.TXF;
  const oc=document.createElement('canvas');oc.width=780;oc.height=230;
  const c=oc.getContext('2d');
  c.font=(size+6)+'px Elite';c.textAlign='center';c.textBaseline='middle';
  const w=c.measureText(txt).width+42;
  c.save();c.translate(390,115);c.strokeStyle=col;c.lineWidth=5;
  for(const off of [0,6]){const hw=Math.min(380,w/2+off),hh=size*0.95+off,n=10;
   c.beginPath();
   for(let s=0;s<=n;s++){const px=-hw+2*hw*s/n,py=-hh+Math.sin(s*2.3+off)*2;s?c.lineTo(px,py):c.moveTo(px,py);}
   for(let s=0;s<=n;s++)c.lineTo(hw+Math.sin(s*2.7+off)*2,-hh+2*hh*s/n);
   for(let s=n;s>=0;s--)c.lineTo(-hw+2*hw*s/n,hh+Math.sin(s*2.1+off)*2);
   for(let s=n;s>=0;s--)c.lineTo(-hw+Math.sin(s*1.7+off)*2,-hh+2*hh*s/n);
   c.closePath();c.globalAlpha=off?0.3:0.88;c.stroke();}
  c.globalAlpha=1;c.fillStyle=col;c.fillText(txt,0,2);
  c.globalAlpha=0.38;c.fillText(txt,1.8,3.5);c.restore();
  c.globalCompositeOperation='destination-out';
  c.globalAlpha=0.48;c.drawImage(iz,0,0,270,480,0,0,780,230);
  c.globalAlpha=0.28;c.drawImage(iz,0,0,270,480,-80,-140,860,510);
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);
  ctx.globalAlpha=Math.min(0.92,p*1.6)*txf;
  ctx.drawImage(oc,-390,-115);ctx.restore();
}

// ── MANILA CHIP (torn paper data chip) ────────────────────────────────────────
function chip(x,y,w2,lab,val,col,tl){
  if(tl<0)return;
  const p=clamp(tl/0.14,0,1);
  const txf=(window.TXF===undefined)?1:window.TXF;
  ctx.save();ctx.globalAlpha=p*txf;
  ctx.translate(x+w2/2,y+26);ctx.rotate(-0.016+0.012*Math.sin(x*3.7+y));
  ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;
  ctx.fillStyle='rgba(228,220,200,0.93)';
  const hw=w2/2,hh=28;
  ctx.beginPath();ctx.moveTo(-hw+4,-hh);ctx.lineTo(hw-3,-hh+1.5);
  ctx.lineTo(hw+3,-hh*0.4);ctx.lineTo(hw-4,1);ctx.lineTo(hw+2,hh*0.5);ctx.lineTo(hw-3,hh);
  ctx.lineTo(-hw+3,hh-1.5);ctx.lineTo(-hw-3,hh*0.45);ctx.lineTo(-hw+4,-hh*0.1);ctx.lineTo(-hw-2,-hh*0.55);
  ctx.closePath();ctx.fill();
  ctx.shadowColor='transparent';
  ctx.font='12px Elite';ctx.textAlign='left';ctx.fillStyle='#6a6256';ctx.fillText(lab,-hw+12,-7);
  ctx.font='21px Elite';const isRed=col===RED||col==='#FF4A2E';
  ctx.fillStyle=isRed?'#8f1d1d':'#1d1a16';ctx.fillText(val,-hw+12,19);
  ctx.restore();
}

// ── VI: ONE CLOCK / T+ STOPWATCH ──────────────────────────────────────────────
function clock(t_elapsed,x,y,tl){
  if(tl<0)return;
  const p=clamp(tl/0.15,0,1);
  const txf=(window.TXF===undefined)?1:window.TXF;
  const secs=Math.max(0,t_elapsed);
  const mm=Math.floor(secs/60),ss=Math.floor(secs%60),ms=Math.floor((secs%1)*100);
  const str=`T+${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
  ctx.save();ctx.globalAlpha=p*txf;
  // background chip
  ctx.fillStyle='rgba(20,22,25,0.88)';
  ctx.fillRect(x-8,y-20,180,34);
  ctx.strokeStyle=RED;ctx.lineWidth=1.5;
  ctx.strokeRect(x-8,y-20,180,34);
  ctx.font='22px Mono';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillStyle=RED;ctx.fillText(str,x,y-3);
  ctx.restore();
}

// ── VI: RED SYNC RING (sonar / ACTION-RECON) ──────────────────────────────────
function sonarRing(cx,cy,r,t,col=RED,pulse=true){
  const p=pulse?0.6+0.4*Math.sin(t*6.28):1;
  ctx.save();
  ctx.globalAlpha=0.7*p;
  ctx.strokeStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=0.25*p;
  ctx.beginPath();ctx.arc(cx,cy,r*1.25,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

// Expanding sonar wave (ACTION-RECON device)
function sonarWave(cx,cy,maxR,tl,col=RED){
  if(tl<0)return;
  const p=clamp(tl/2.0,0,1);
  for(let i=0;i<3;i++){
    const phase=(p-i*0.33+1)%1;
    const r=phase*maxR;
    const a=(1-phase)*0.5;
    ctx.save();ctx.globalAlpha=a;
    ctx.strokeStyle=col;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
}

// ── VI: EVIDENCE PANEL (hard-edge rectangle with hairline) ────────────────────
function evPanel(x,y,w,h,tl,label=''){
  if(tl<0)return;
  const p=clamp(tl/0.14,0,1);
  const txf=(window.TXF===undefined)?1:window.TXF;
  ctx.save();ctx.globalAlpha=p*txf;
  ctx.fillStyle=PAN;ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=HAIR;ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);
  if(label){
    ctx.font='11px Mono';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillStyle=SEC;ctx.fillText(label,x+6,y+5);
  }
  ctx.restore();
}

// ── VI: KNOWN / UNKNOWN COLUMNS ───────────────────────────────────────────────
function knownUnknown(items_k,items_u,tl){
  if(tl<0)return;
  const txf=(window.TXF===undefined)?1:window.TXF;
  const x0=20,cx=W/2+10,y0=H*0.36,rowH=64;
  // column headers
  const hp=clamp(tl/0.15,0,1);
  ctx.save();ctx.globalAlpha=hp*txf;
  // KNOWN header
  ctx.fillStyle='rgba(20,22,25,0.9)';ctx.fillRect(x0,y0-36,cx-x0-8,32);
  ctx.strokeStyle=AMB;ctx.lineWidth=1.5;ctx.strokeRect(x0,y0-36,cx-x0-8,32);
  ctx.font='17px Mono';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=AMB;ctx.fillText('✓ KNOWN',(x0+cx-8)/2,y0-20);
  // UNRESOLVED header
  ctx.fillStyle='rgba(20,22,25,0.9)';ctx.fillRect(cx,y0-36,W-cx-20,32);
  ctx.strokeStyle=RED;ctx.lineWidth=1.5;ctx.strokeRect(cx,y0-36,W-cx-20,32);
  ctx.fillStyle=RED;ctx.fillText('? UNRESOLVED',(cx+W-20)/2,y0-20);
  ctx.restore();
  // rows
  const maxRows=Math.max(items_k.length,items_u.length);
  for(let i=0;i<maxRows;i++){
    const rowTl=tl-0.2-i*0.18;
    if(rowTl<0)continue;
    const rp=clamp(rowTl/0.15,0,1);
    ctx.save();ctx.globalAlpha=rp*txf;
    const ry=y0+i*rowH;
    // left col (known)
    if(items_k[i]){
      ctx.fillStyle='rgba(18,22,18,0.85)';ctx.fillRect(x0,ry,cx-x0-8,rowH-6);
      ctx.strokeStyle='rgba(100,140,80,0.4)';ctx.lineWidth=1;ctx.strokeRect(x0,ry,cx-x0-8,rowH-6);
      ctx.font='13px Elite';ctx.textAlign='left';ctx.fillStyle=TXT;
      const lines=items_k[i].split('\n');
      lines.forEach((l,li)=>ctx.fillText(l,x0+10,ry+16+li*18));
    }
    // right col (unknown / dashed)
    if(items_u[i]){
      ctx.fillStyle='rgba(22,14,12,0.85)';ctx.fillRect(cx,ry,W-cx-20,rowH-6);
      ctx.setLineDash([4,3]);ctx.strokeStyle=`rgba(255,74,46,0.4)`;ctx.lineWidth=1;
      ctx.strokeRect(cx,ry,W-cx-20,rowH-6);ctx.setLineDash([]);
      ctx.font='13px Elite';ctx.textAlign='left';ctx.fillStyle='#cc8070';
      const lines=items_u[i].split('\n');
      lines.forEach((l,li)=>ctx.fillText(l,cx+10,ry+16+li*18));
    }
    ctx.restore();
  }
}

// ── VI: RED SYNC LINE (convergence) ───────────────────────────────────────────
function syncLine(x1,y1,x2,y2,tl,col=RED){
  if(tl<0)return;
  const p=clamp(tl/0.3,0,1);
  const txf=(window.TXF===undefined)?1:window.TXF;
  ctx.save();ctx.globalAlpha=0.7*p*txf;
  ctx.strokeStyle=col;ctx.lineWidth=1.5;
  ctx.setLineDash([5,4]);
  const ex=lerp(x1,x2,eo(p)),ey=lerp(y1,y2,eo(p));
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// ── VI: SOURCE TAG CHIP (tiny mono tag above evidence frame) ──────────────────
function srcTag(txt,x,y,tl){
  if(tl<0)return;
  const p=clamp(tl/0.12,0,1);
  const txf=(window.TXF===undefined)?1:window.TXF;
  ctx.save();ctx.globalAlpha=p*txf;
  ctx.font='10px Mono';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(14,16,18,0.88)';
  const tw=ctx.measureText(txt).width+10;
  ctx.fillRect(x,y-9,tw,18);
  ctx.strokeStyle=HAIR;ctx.lineWidth=0.8;ctx.strokeRect(x,y-9,tw,18);
  ctx.fillStyle=SEC;ctx.fillText(txt,x+5,y);
  ctx.restore();
}

// ── DEPTH COUNTER (ACTION-RECON device) ───────────────────────────────────────
function depthCounter(depth_m,tl){
  if(tl<0)return;
  const p=clamp(tl/0.15,0,1);
  const txf=(window.TXF===undefined)?1:window.TXF;
  ctx.save();ctx.globalAlpha=p*txf;
  const x=W-140,y=H*0.28;
  ctx.fillStyle='rgba(10,12,14,0.92)';ctx.fillRect(x,y,128,62);
  ctx.strokeStyle=RED;ctx.lineWidth=1.5;ctx.strokeRect(x,y,128,62);
  // drill-line
  ctx.strokeStyle='rgba(255,74,46,0.5)';ctx.lineWidth=1;
  for(let i=0;i<5;i++){
    ctx.beginPath();ctx.moveTo(x+8+i*22,y+6);ctx.lineTo(x+8+i*22,y+56);ctx.stroke();
  }
  ctx.font='11px Mono';ctx.textAlign='left';ctx.fillStyle=SEC;ctx.fillText('DEPTH',x+8,y+16);
  ctx.font='24px Mono';ctx.fillStyle=RED;
  ctx.fillText(depth_m,x+8,y+48);
  ctx.restore();
}

// ── DOSSIER COVER PAGE ─────────────────────────────────────────────────────────
function covpage(p){
  ctx.fillStyle='#d4cbb4';ctx.fillRect(0,0,W,H);
  ctx.save();const sc=1+0.10*p;ctx.translate(W/2,H/2);ctx.scale(sc,sc);ctx.translate(-W/2,-H/2);
  ctx.save();ctx.globalAlpha=0.62;
  for(let x=0;x<2;x++)for(let y=0;y<2;y++)ctx.drawImage(nz,x*270,y*480);
  ctx.restore();
  // border
  ctx.save();ctx.strokeStyle='#2e2820';ctx.setLineDash([9,6]);ctx.lineWidth=2;
  ctx.strokeRect(18,18,W-36,H-36);ctx.strokeStyle='#5a4e3e';ctx.lineWidth=1;
  ctx.strokeRect(30,30,W-60,H-60);ctx.setLineDash([]);
  // corner marks
  ctx.strokeStyle='#8a2e2b';ctx.lineWidth=3;
  [[14,14,1,1],[W-14,14,-1,1],[14,H-14,1,-1],[W-14,H-14,-1,-1]].forEach(c=>{
    ctx.beginPath();ctx.moveTo(c[0]+c[2]*26,c[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(c[0],c[1]+c[3]*26);ctx.stroke();
  });
  ctx.restore();
  // header bar
  ctx.fillStyle='#17140f';ctx.fillRect(0,110,W,54);
  ctx.font='20px Elite';ctx.fillStyle='#d4cbb4';ctx.textAlign='center';
  ctx.fillText('CLASSIFIED — FIELD DOSSIER',W/2,144);
  // case title
  ctx.fillStyle='#17140f';ctx.font='42px Elite';ctx.fillText('CASE FILE No. 10',W/2,262);
  ctx.font='22px Elite';ctx.fillStyle='#3a332a';ctx.fillText('SUBJECT: POINT NEMO & THE BLOOP',W/2,304);
  // data rows
  ctx.textAlign='left';ctx.font='14px Elite';
  const rows=[
    'site: SOUTH PACIFIC OCEAN',
    'coords: 48°S 123°W — POLE OF INACCESSIBILITY',
    'anomaly: ULTRA-LOW FREQUENCY SIGNAL',
    'recorded: SUMMER 1997 · NOAA PMEL',
    'range: >5,000 KM · 3 SENSORS',
    'verdict: UNRESOLVED'
  ];
  let ry=534;
  rows.forEach((r,i)=>{
    ctx.fillStyle='#3a332a';ctx.fillText('•  '+r,60,ry);
    if(i%2===1){ctx.fillStyle='#17140f';ctx.fillRect(60,ry+10,120+(i*43)%120,6);}
    ry+=52;
  });
  ctx.restore();
  // polaroid exhibit
  if(IMG.spectro&&IMG.spectro.width){
    const pw=164,iw=IMG.spectro.width,ih=IMG.spectro.height,ph=pw*ih/iw;
    ctx.save();ctx.translate(W*0.72,H*0.76);ctx.rotate(0.08);
    ctx.shadowColor='rgba(0,0,0,0.7)';ctx.shadowBlur=16;ctx.shadowOffsetY=5;
    ctx.fillStyle='#e9e4d8';ctx.fillRect(-pw/2-8,-ph/2-8,pw+16,ph+40);
    ctx.shadowColor='transparent';
    ctx.filter='grayscale(1) contrast(1.15) brightness(0.9)';
    ctx.drawImage(IMG.spectro,-pw/2,-ph/2,pw,ph);
    ctx.filter='none';
    ctx.font='12px Elite';ctx.textAlign='center';ctx.fillStyle='#333';
    ctx.fillText('NOAA 1997 CRT',0,ph/2+22);
    ctx.restore();
  }
  stamp('ANOMALY UNRESOLVED',W/2,H*0.455,-0.07,1,22);
}

// ── CASE FILE TAB + CHRONIC BADGE ─────────────────────────────────────────────
function tab(){
  ctx.save();ctx.translate(14,H-30);ctx.rotate(-0.011);ctx.globalAlpha=0.88;
  ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;
  ctx.fillStyle='rgba(224,216,196,0.92)';
  ctx.beginPath();ctx.moveTo(3,-14);ctx.lineTo(314,-12.5);ctx.lineTo(318,-5);
  ctx.lineTo(312,1);ctx.lineTo(317,8);ctx.lineTo(313,14);
  ctx.lineTo(4,12.5);ctx.lineTo(-2,6);ctx.lineTo(3,0);ctx.lineTo(-1,-7);ctx.closePath();ctx.fill();
  ctx.shadowColor='transparent';
  ctx.font='13px Elite';ctx.textAlign='left';ctx.fillStyle='#2e2a24';
  ctx.fillText('CASE FILE No. 10 — POINT NEMO & THE BLOOP',9,5);
  ctx.restore();
  ctx.save();ctx.translate(W-58,26);ctx.rotate(0.03);ctx.globalAlpha=0.65;
  ctx.font='15px Elite';ctx.textAlign='center';ctx.fillStyle='rgba(220,70,50,0.9)';
  ctx.fillText('CHRONIC',0,0);ctx.restore();
}

// ── FREQUENCY SPECTROGRAM (VI data chart with red playhead) ───────────────────
function specChart(pct,tl){
  if(tl<0)return;
  const p=clamp(tl/0.2,0,1);
  const txf=(window.TXF===undefined)?1:window.TXF;
  const x=18,y=H*0.52,cw=W-36,ch=160;
  ctx.save();ctx.globalAlpha=p*txf;
  ctx.fillStyle='rgba(10,12,16,0.92)';ctx.fillRect(x,y,cw,ch);
  ctx.strokeStyle=HAIR;ctx.lineWidth=1;ctx.strokeRect(x,y,cw,ch);
  // y-axis label
  ctx.font='10px Mono';ctx.textAlign='center';ctx.fillStyle=SEC;
  ctx.save();ctx.translate(x-12,y+ch/2);ctx.rotate(-Math.PI/2);ctx.fillText('AMPLITUDE',0,0);ctx.restore();
  // frequency bars (simulated spectrogram)
  const bars=32;
  for(let i=0;i<bars;i++){
    const phase=i/bars;
    const bh=ch*0.15*(1+Math.sin(i*1.8)*0.5+Math.cos(i*0.7)*0.4)*
              (i>10&&i<22?2.5:0.8); // Bloop peak in middle
    const bx=x+6+i*(cw-12)/bars;
    const col=i>10&&i<22?`rgba(255,74,46,0.8)`:`rgba(232,180,74,0.3)`;
    ctx.fillStyle=col;
    ctx.fillRect(bx,y+ch-bh,((cw-12)/bars)-2,bh*eo(p));
  }
  // red playhead
  const px2=x+6+(pct*(cw-12));
  ctx.strokeStyle=RED;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(px2,y+4);ctx.lineTo(px2,y+ch-4);ctx.stroke();
  // playhead clock label
  ctx.font='12px Mono';ctx.textAlign='left';ctx.fillStyle=RED;
  ctx.fillText(`T+${(pct*60).toFixed(1)}s`,px2+4,y+18);
  // axis labels
  ctx.font='10px Mono';ctx.fillStyle=SEC;ctx.textAlign='center';
  ctx.fillText('0 Hz',x+18,y+ch+14);ctx.fillText('40 Hz',x+cw/2,y+ch+14);ctx.fillText('80 Hz',x+cw-10,y+ch+14);
  ctx.restore();
}

// ── 3-COLUMN SYNC GRID (VI device: sensors converge) ─────────────────────────
function syncGrid(tl,t){
  if(tl<0)return;
  const txf=(window.TXF===undefined)?1:window.TXF;
  const gx=18,gy=H*0.24,gw=(W-54)/3,gh=110,gap=9;
  const labels=['SENSOR #1\nHAWAII','SENSOR #2\nEQUATOR','SENSOR #3\nANTARCTICA'];
  const delays=[0,0.22,0.44];
  const convergeTl=tl-1.2;

  for(let i=0;i<3;i++){
    const stl=tl-delays[i];
    if(stl<0)continue;
    const p=clamp(stl/0.14,0,1);
    const cx2=gx+i*(gw+gap);
    ctx.save();ctx.globalAlpha=p*txf;
    ctx.fillStyle=PAN;ctx.fillRect(cx2,gy,gw,gh);
    ctx.strokeStyle=AMB;ctx.lineWidth=1;ctx.strokeRect(cx2,gy,gw,gh);
    // sonar rings inside panel
    const ringCx=cx2+gw/2,ringCy=gy+gh/2+10;
    sonarWave(ringCx,ringCy,gw*0.4,stl,AMB);
    sonarRing(ringCx,ringCy,gw*0.18,t,AMB,true);
    // label
    ctx.font='10px Mono';ctx.textAlign='center';ctx.fillStyle=TXT;
    labels[i].split('\n').forEach((l,li)=>ctx.fillText(l,cx2+gw/2,gy+16+li*13));
    ctx.restore();
    // source tag
    srcTag(`NOAA·S${i+1}`,cx2+2,gy-6,stl);
  }
  // convergence: red sync line from each sensor to center (epicenter)
  if(convergeTl>0){
    const epicx=W/2,epicy=gy+gh+70;
    // epicenter dot
    const cp=clamp(convergeTl/0.2,0,1);
    ctx.save();ctx.globalAlpha=cp*txf;
    ctx.beginPath();ctx.arc(epicx,epicy,14,0,Math.PI*2);
    ctx.fillStyle='rgba(255,74,46,0.15)';ctx.fill();
    ctx.strokeStyle=RED;ctx.lineWidth=2;ctx.stroke();
    ctx.font='11px Mono';ctx.textAlign='center';ctx.fillStyle=RED;
    ctx.fillText('EPICENTER',epicx,epicy+28);
    ctx.restore();
    // sync lines
    for(let i=0;i<3;i++){
      const cx2=gx+i*(gw+gap)+gw/2;
      syncLine(cx2,gy+gh,epicx,epicy,convergeTl-i*0.1);
    }
  }
}

// ── FREQUENCY MELT (bloop acoustic distortion on spectrogram) ─────────────────
function meltVI(img,z,amp,ph){
  if(!img||!img.width)return;
  const iw=img.width,ih=img.height,s=Math.max(W/iw,H/ih)*z;
  const w=iw*s,h=ih*s,x0=(W-w)/2,y0=(H-h)/2,st=28,sh=h/st,ssh=ih/st;
  ctx.save();ctx.filter='grayscale(1) contrast(1.35) brightness(0.88)';
  for(let i=0;i<st;i++){
    const f=i/st,dx=amp*Math.sin(i*0.9+ph)*f,dy=amp*0.45*f*f;
    ctx.drawImage(img,0,ssh*i,iw,ssh,x0+dx,y0+sh*i+dy,w,sh+1.5);
  }
  ctx.filter='none';ctx.restore();
}

// ══════════════════════════════════════════════════════════════════════════════
// MAIN RENDER — window.renderAt(t)
// Scene timing:
//  0.0 – 1.2s  : HOOK — Living Poster / dossier cover slam
//  1.2 – 5.0s  : SCENE 1 — Point Nemo map + T+ ONE CLOCK
//  5.0 – 8.8s  : SCENE 2 — Space isolation + KNOWN/UNKNOWN columns
//  8.8 – 14.0s : SCENE 3 — 3-sensor SYNC GRID + sonar ACTION-RECON
// 14.0 – 19.5s : SCENE 4 — THE BLOOP + spectrogram playhead + depth counter
// 19.5 – 24.5s : SCENE 5 — 3000 miles + sync lines convergence evidence board
// 24.5 – 29.0s : SCENE 6 — Icequake official verdict + KNOWN/UNKNOWN verdict
// 29.0 – 31.5s : CLOSER — dossier cover loop back
// ══════════════════════════════════════════════════════════════════════════════

window.renderAt=function(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();ctx.scale(2,2);
  ctx.fillStyle=GND;ctx.fillRect(0,0,W,H);

  sway(t);

  const S=(a,b)=>t>=a&&t<b;
  const L=a=>t-a;
  window.TXF=1;

  // ─── HOOK 0.0 – 1.2s: LIVING DOSSIER COVER SLAM ───────────────────────────
  if(t<1.2){
    if(t<0.68){
      // 3-snap punch zoom (COVER PUNCH SPEC: zoom delta ≥20%, 3-step snap + jitter)
      const zp=t<0.22?eo(t/0.22)*0.85:(t<0.44?0.85+eo((t-0.22)/0.22)*0.7:1.55+eo((t-0.44)/0.22)*0.62);
      ctx.save();
      if(t>0.1){ctx.translate(Math.sin(t*58)*4*Math.min(1,(t-0.1)*8),Math.cos(t*50)*3*Math.min(1,(t-0.1)*8));}
      covpage(zp);ctx.restore();
      if(t>0.08&&t<0.18){ctx.fillStyle='rgba(255,60,60,'+(0.28*(1-(t-0.08)/0.1))+')';ctx.fillRect(0,0,W,H);}
      if(t>0.22&&t<0.30){ctx.fillStyle='rgba(255,255,255,'+(0.14*(1-(t-0.22)/0.08))+')';ctx.fillRect(0,0,W,H);}
      if(t>0.44&&t<0.56){ctx.fillStyle='rgba(255,60,60,'+(0.24*(1-(t-0.44)/0.12))+')';ctx.fillRect(0,0,W,H);}
    } else {
      // zoom in tight — investigation desk feeling
      const c2=(t-0.68)/0.52;
      ctx.save();ctx.translate(W/2,H/2);ctx.scale(1.74+0.10*c2,1.74+0.10*c2);ctx.translate(-W*0.52,-H*0.60);
      covpage(0);ctx.restore();
      ctx.save();ctx.strokeStyle='rgba(255,74,46,0.85)';ctx.setLineDash([7,5]);ctx.lineWidth=1.8;
      ctx.strokeRect(52,205,W-104,H-505);ctx.setLineDash([]);ctx.lineWidth=2.8;
      [[42,195,1,1],[W-42,195,-1,1],[42,H-285,1,-1],[W-42,H-285,-1,-1]].forEach(c=>{
        ctx.beginPath();ctx.moveTo(c[0]+c[2]*20,c[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(c[0],c[1]+c[3]*20);ctx.stroke();
      });
      ctx.globalAlpha=0.04;ctx.fillStyle='#000';for(let sy=0;sy<H;sy+=4)ctx.fillRect(0,sy,W,1);
      ctx.restore();
      if(t<0.80){ctx.fillStyle='rgba(255,255,255,'+(0.28*(1-(t-0.68)/0.12))+')';ctx.fillRect(0,0,W,H);}
    }
    grain(t);
  }

  // ─── SCENE 1: 1.2 – 5.0s — POINT NEMO MAP + ONE CLOCK ────────────────────
  else if(S(1.2,5.0)){
    const q=clamp(L(1.2)/2.2,0,1);
    coverVI(IMG.map,1.16-0.10*eo(q),0,-0.18);dk(0.3);
    flash(L(1.2));
    // VI source grade + tag
    srcTag('USGS · NOAA',18,H*0.14,L(1.4));
    // ONE CLOCK — T+0 from moment signal was detected (we are at pre-detection)
    clock(-14.0,22,H*0.20,L(1.3)); // T-14:xx (pre event)
    big('IN THE SOUTH PACIFIC',H*0.30,40,L(1.3));
    big('POINT NEMO.',H*0.39,64,L(1.5),RED);
    // coordinate ring (ACTION-RECON: sonar pin)
    sonarWave(W/2-18,H/2-20,55,L(1.9),RED);
    sonarRing(W/2-18,H/2-20,28,t,RED,true);
    mono('48°52.6′S  123°23.6′W',22,H/2+45,13,L(2.0),AMB);
    chip(18,H*0.625,220,'SITE','SOUTH PACIFIC',TXT,L(1.6));
    chip(18,H*0.705,214,'STATUS','POLE OF INACCESSIBILITY',RED,L(2.2));
    sub('in the middle of the south pacific lies point nemo',H*0.86,L(1.3));
    tab();grain(t);
  }

  // ─── SCENE 2: 5.0 – 8.8s — SPACE ISOLATION + KNOWN/UNKNOWN ───────────────
  else if(S(5.0,8.8)){
    const q2=clamp(L(5.0)/3.8,0,1);
    coverVI(IMG.space,1.12+0.07*q2,0,-0.12);dk(0.38);
    flash(L(5.0));
    srcTag('NASA · ISS',18,H*0.14,L(5.2));
    clock(-8.0,22,H*0.20,L(5.1));
    big('THE MOST ISOLATED',H*0.28,38,L(5.2));
    big('PLACE ON EARTH.',H*0.36,44,L(5.5),AMB);
    stamp('2,688 KM TO LAND',W/2,H*0.46,-0.05,L(6.0),24);
    // KNOWN / UNKNOWN columns
    knownUnknown(
      ['Point Nemo exists\n(NOAA 1992)','ISS crew are\nnearest humans'],
      ['Why here?\nno known reason','What lies\ndirectly below?']
      ,L(6.4)
    );
    sub('the closest humans aren\'t on land — they\'re on the space station',H*0.86,L(5.2));
    tab();grain(t);
  }

  // ─── SCENE 3: 8.8 – 14.0s — 3-SENSOR SYNC GRID + SONAR ACTION-RECON ──────
  else if(S(8.8,14.0)){
    coverVI(IMG.spectro,1.20-0.08*eo(L(8.8)/5.2),0,-0.08);dk(0.55);
    flash(L(8.8));
    srcTag('NOAA PMEL · 1997',18,H*0.12,L(9.0));
    clock(0.0,22,H*0.19,L(9.0)); // T+0:00 — detection moment
    big('SUMMER 1997.',H*0.22,48,L(9.0));
    // 3-column sync grid
    syncGrid(L(9.2),t);
    stamp('NOAA HYDROPHONE ARRAY',W/2,H*0.73,0.03,L(11.0),22,RED);
    chip(18,H*0.79,220,'SENSORS','3 × EQUATORIAL PACIFIC',TXT,L(10.0));
    chip(18,H*0.855,220,'EVENT','ANOMALOUS SIGNAL',RED,L(11.5));
    sub('noaa\'s deep-sea microphones detected something impossible',H*0.91,L(9.0));
    tab();grain(t);
  }

  // ─── SCENE 4: 14.0 – 19.5s — THE BLOOP + SPECTROGRAM + DEPTH COUNTER ──────
  else if(S(14.0,19.5)){
    meltVI(IMG.spectro,1.32+0.06*(L(14.0)/5.5),5.8,t*5.8);dk(0.30);
    flash(L(14.0));
    srcTag('NOAA RECORDING · 1997',18,H*0.12,L(14.2));
    // T+ clock — elapsed from detection
    clock(L(14.0)-0,22,H*0.19,L(14.1));
    big('AN ULTRA-LOW FREQUENCY',H*0.25,33,L(14.2));
    big('"THE BLOOP."',H*0.34,66,L(14.7),RED);
    // spectrogram chart with red playhead
    specChart(clamp(L(14.0)/5.5,0,1),L(14.9));
    // depth counter (ACTION-RECON)
    depthCounter('>4,000 M',L(14.3));
    chip(18,H*0.75,218,'DURATION','>1 MINUTE',TXT,L(15.2));
    chip(18,H*0.825,218,'FREQ BAND','0 – 40 Hz',RED,L(16.0));
    sub('an ultra-low frequency sound rising from the depths',H*0.91,L(14.2));
    tab();grain(t);
  }

  // ─── SCENE 5: 19.5 – 24.5s — 3000 MILES + SYNC LINES CONVERGENCE ──────────
  else if(S(19.5,24.5)){
    coverVI(IMG.hero,1.13+0.09*(L(19.5)/5.0),-0.08,-0.18);dk(0.42);
    flash(L(19.5));
    srcTag('WIKIMEDIA · PD',18,H*0.12,L(19.7));
    clock(L(19.5),22,H*0.19,L(19.6));
    big('DETECTED ACROSS',H*0.26,40,L(19.8));
    big('3,000 MILES.',H*0.34,58,L(20.3),RED);
    stamp('LOUDER THAN A BLUE WHALE',W/2,H*0.445,0.025,L(21.2),21);
    // evidence panel: range
    evPanel(18,H*0.49,W-36,90,L(20.5),'SENSOR RANGE EVIDENCE');
    chip(22,H*0.50,206,'RANGE','>5,000 KM',RED,L(20.6));
    chip(256,H*0.50,206,'dB LEVEL','>220 dB',TXT,L(21.4));
    // VI: red sync lines from 3 sensor positions converging to epicenter point
    const epx=W/2,epy=H*0.60;
    syncLine(44,H*0.51,epx,epy,L(21.8));
    syncLine(W/2,H*0.51,epx,epy,L(22.1));
    syncLine(W-44,H*0.51,epx,epy,L(22.4));
    // epicenter convergence badge
    const cp2=clamp(L(22.5)/0.2,0,1);
    if(cp2>0){
      ctx.save();ctx.globalAlpha=cp2;
      ctx.beginPath();ctx.arc(epx,epy,18,0,Math.PI*2);
      ctx.fillStyle='rgba(255,74,46,0.2)';ctx.fill();
      ctx.strokeStyle=RED;ctx.lineWidth=2;ctx.stroke();
      ctx.font='12px Mono';ctx.textAlign='center';ctx.fillStyle=RED;
      ctx.fillText('EPICENTER',epx,epy+32);
      ctx.restore();
    }
    sub('detected across three thousand miles... louder than any known creature',H*0.91,L(19.8));
    tab();grain(t);
  }

  // ─── SCENE 6: 24.5 – 29.0s — ICEQUAKE VERDICT + KNOWN/UNRESOLVED COLUMNS ──
  else if(S(24.5,29.0)){
    coverVI(IMG.ice,1.16+0.08*(L(24.5)/4.5),0,-0.18);dk(0.50);
    flash(L(24.5));
    srcTag('NOAA · PD',18,H*0.12,L(24.7));
    clock(L(24.5),22,H*0.19,L(24.6));
    big('OFFICIAL VERDICT:',H*0.26,34,L(24.8));
    big('ICEBERG CALVING.',H*0.34,44,L(25.3),AMB);
    stamp('CRYOSEISM / UNCONFIRMED',W/2,H*0.435,-0.055,L(26.0),24,RED);
    // final KNOWN / UNRESOLVED verdict board
    knownUnknown(
      ['Source: cryoseism\n(NOAA 2005)','Epicenter near\nAntarctica'],
      ['Why Point Nemo?\nexact origin unclear','No recording\nmatched since']
      ,L(26.4)
    );
    sub('years later, they blamed cracking icebergs off antarctica',H*0.91,L(24.8));
    tab();grain(t);
  }

  // ─── CLOSER 29.0 – 31.5s — DOSSIER COVER LOOP BACK ───────────────────────
  else {
    const lt=L(29.0);
    window.TXF=(lt<0.4)?clamp(lt/0.4,0,1):1;
    covpage(0.165+0.022*lt);
    if(lt<0.14){ctx.fillStyle='rgba(255,255,255,'+(0.24*(1-lt/0.14))+')';ctx.fillRect(0,0,W,H);}
    big('WHAT MADE THAT SOUND?',H*0.37,42,L(29.2));
    stamp('STILL UNRESOLVED',W/2,H*0.47,-0.065,L(30.0),28,RED);
    mono('A  B  or  C  👇',W/2-50,H*0.82,16,L(29.4),AMB);
    sub('what do you think made that sound?',H*0.89,L(29.2));
  }

  // ── GLOBAL: film grain + post vignette ────────────────────────────────────
  if(t>=1.2){grain(t);}
  post();
  ctx.restore();
};
