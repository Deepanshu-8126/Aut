<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'OswaldB';src:url('../../explainer-pipeline/assets/fonts/Oswald-Bold.ttf');}
@font-face{font-family:'Mono';src:url('../../explainer-pipeline/assets/fonts/JetBrainsMono-Bold.ttf');}
@font-face{font-family:'Elite';src:url('../../explainer-pipeline/assets/fonts/SpecialElite.ttf');}
html,body{margin:0;padding:0;background:#060a12;overflow:hidden;}
canvas{display:block;width:720px;height:1280px;margin:auto;}
</style></head><body><canvas id="cv" width="1440" height="2560"></canvas><script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=720,H=1280; // Design coordinates (scaled 2x on canvas)
const BG='#0b1320',BLUE='#17253a',ACCENT='#ff4a2e',GOLD='#ffd60a',TXT='#eceae4';

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eo=t=>1-Math.pow(1-clamp(t,0,1),3);

window.READY=1;window.FONTSOK=1;

window.renderAt=function(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();ctx.scale(2,2);

  // ── 1. PAPER TEXTURE / FIELD NOTES BG ───────────────────────────────────
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);

  // Subtle grid lines (paper notes)
  ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Header field notes branding
  ctx.font='12px Mono';ctx.fillStyle='rgba(236,234,228,0.5)';ctx.textAlign='left';
  ctx.fillText('FIELD NOTES / BLACK HOLES',40,50);
  ctx.textAlign='right';ctx.fillText('RAAZVIK / ASTROPHYSICS',W-40,50);

  // ── 2. SCENE TIMELINE & DYNAMIC ANIMATIONS ─────────────────────────────
  let title="EVENT HORIZON", sub="Where gravity traps even light itself.";
  if(t>5){title="ACCRETION DISK"; sub="Matter spirals inward at near-light speed.";}
  if(t>12){title="GRAVITATIONAL LENSING"; sub="Massive gravity bends starlight around the void.";}
  if(t>20){title="THE SHADOW"; sub="A sphere of darkness twice the event horizon.";}
  if(t>28){title="TIME STANDS STILL"; sub="At the edge, time dilation becomes infinite.";}

  // Paper-cut celestial visuals (Centerpiece)
  const cx=W/2, cy=H*0.42;

  if(t<=5){
    // Scene 1: Black Hole core (paper-cut layered circles with glow)
    ctx.save();
    ctx.shadowColor='#17253a';ctx.shadowBlur=40;
    ctx.fillStyle='#04060b';ctx.beginPath();ctx.arc(cx,cy,120,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#2e405a';ctx.lineWidth=4;ctx.stroke();
    ctx.restore();

    // Photon sphere ring
    ctx.strokeStyle=GOLD;ctx.lineWidth=2;ctx.setLineDash([8,6]);
    ctx.beginPath();ctx.arc(cx,cy,145,t*0.5,t*0.5+Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
  } else {
    // Scene 2+: Accretion Disk swirl with paper particles
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(t*0.8);
    for(let i=0;i<40;i++){
      const angle=(i/40)*Math.PI*2;
      const dist=100+(i*4)%120;
      const px=Math.cos(angle)*dist;
      const py=Math.sin(angle)*(dist*0.4); // elliptical tilt
      ctx.fillStyle=(i%2===0)?GOLD:ACCENT;
      ctx.beginPath();ctx.arc(px,py,4+i%3,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();

    // Central black void
    ctx.fillStyle='#04060b';ctx.beginPath();ctx.arc(cx,cy,95,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=ACCENT;ctx.lineWidth=3;ctx.stroke();
  }

  // ── 3. TYPOGRAPHY & FIELD NOTES CARDS ───────────────────────────────────
  // Paper card container
  ctx.fillStyle='rgba(23,37,58,0.85)';ctx.fillRect(40,H*0.68,W-80,240);
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1.5;ctx.strokeRect(40,H*0.68,W-80,240);

  ctx.font='bold 32px OswaldB';ctx.fillStyle=TXT;ctx.textAlign='left';
  ctx.fillText(title,70,H*0.68+60);

  ctx.font='18px Elite';ctx.fillStyle=GOLD;
  ctx.fillText(sub,70,H*0.68+110);

  // Scientific metric badge
  ctx.fillStyle='rgba(255,74,46,0.15)';ctx.fillRect(70,H*0.68+145,210,40);
  ctx.strokeStyle=ACCENT;ctx.lineWidth=1;ctx.strokeRect(70,H*0.68+145,210,40);
  ctx.font='15px Mono';ctx.fillStyle=ACCENT;ctx.textAlign='center';
  ctx.fillText('SCHWARZSCHILD RADIUS',175,H*0.68+171);

  // Bottom footer branding
  ctx.font='13px Mono';ctx.fillStyle='rgba(236,234,228,0.6)';ctx.textAlign='center';
  ctx.fillText('RAAZVIK SCIENCE EXPLAINER',W/2,H-50);

  ctx.restore();
};
</script></body></html>
