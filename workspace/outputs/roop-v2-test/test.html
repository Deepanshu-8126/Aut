<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Anton';src:url('../../explainer-pipeline/assets/fonts/Anton-Regular.ttf');}
@font-face{font-family:'InterBlack';src:url('../../explainer-pipeline/assets/fonts/Inter-Black.ttf');}
html,body{margin:0;background:#000;}canvas{width:540px;height:960px;display:block;}
</style></head><body><canvas id="cv" width="1080" height="1920"></canvas><script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=540,H=960,FPS=30,DUR=27.80;
const OUT='#0a0a12';
function R(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function ez(u){u=clamp(u,0,1);return u*u*(3-2*u);}
function bko(u){u=clamp(u,0,1);const c=1.70158;return 1+((c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2));}
const IM={};let loaded=0;const SRCS=[
 ['A','img/A_SLEEP_hd.jpg'],['B','img/B_XRAY_hd.jpg'],['C','img/C_DISCS_hd.jpg'],
 ['D','img/D_DAY_hd.jpg'],['E','img/E_ASTRO_hd.jpg'],
 ['AW','img/A_WAKE_hd.jpg'],['CT','img/C_THIN_hd.jpg'],['DT','img/D_TALL_hd.jpg'],
 ['AB','img/A_BREATH_hd.jpg'],['DB','img/D_BREATH_hd.jpg'],
 ['AW2','img/A_WAKE2_hd.jpg'],['DBL','img/D_BLINK_hd.jpg']];
SRCS.forEach(([k,f])=>{const im=new Image();im.onload=()=>{loaded++;};im.src=f;IM[k]=im;});
window.READY=0;
Promise.all([document.fonts.load('40px Anton'),document.fonts.load('800 40px InterBlack')]).then(()=>{window.FONTOK=1;});
const chk=setInterval(()=>{if(loaded>=SRCS.length&&window.FONTOK===1){window.READY=1;clearInterval(chk);}},50);

// img draw with zoom z (1=fit), pan px,py in source px offsets
function shot(im,z,px,py){
 const iw=1080,ih=1935; // source
 const sw=iw/z, sh=sw*(H/W);
 let sx=(iw-sw)/2+(px||0), sy=(ih-sh)/2+(py||0);
 sx=clamp(sx,0,iw-sw); sy=clamp(sy,0,ih-sh);
 ctx.drawImage(im,sx,sy,sw,sh,0,0,W,H);
}
const GC=document.createElement('canvas');GC.width=W;GC.height=H;
(function(){const g2=GC.getContext('2d');const id=g2.createImageData(W,H);
 let sd=12345;for(let i=0;i<id.data.length;i+=4){sd=(sd*1103515245+12345)&0x7fffffff;
  const v=110+(sd%37);id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}
 g2.putImageData(id,0,0);})();
function grain(t){const ga=0.09*Math.max(0,Math.min(1,t/0.6,(27.8-t)/0.6));
 if(ga<0.005)return;
 const fi=Math.floor(t*30)%49;const ox=(fi*53)%97,oy=(fi*97)%139;
 ctx.save();ctx.globalAlpha=ga;ctx.globalCompositeOperation='overlay';
 ctx.drawImage(GC,-ox,-oy);ctx.drawImage(GC,-ox+W,-oy);
 ctx.drawImage(GC,-ox,-oy+H);ctx.drawImage(GC,-ox+W,-oy+H);
 ctx.restore();}
function vig(){const g=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.72);
 g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,10,0.34)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function words(ws,fs,y){ctx.save();ctx.font=fs+'px Anton';ctx.textAlign='left';
 let tot=0;for(const[w]of ws)tot+=ctx.measureText(w).width;
 let x=(W-tot)/2;
 for(const[w,c]of ws){ctx.lineWidth=fs*0.18;ctx.strokeStyle=OUT;ctx.lineJoin='round';
  ctx.strokeText(w,x,y);ctx.fillStyle=c;ctx.fillText(w,x,y);x+=ctx.measureText(w).width;}
 ctx.restore();}
function cap(ws,fs,y,tl){if(tl<0)return;const p=clamp(tl/0.14,0,1);const s=0.65+0.35*bko(p);
 ctx.save();ctx.translate(W/2,y);ctx.scale(s,s);ctx.globalAlpha=Math.min(1,p*1.6);
 ctx.translate(-W/2,-y);words(ws,fs,y);ctx.restore();}
function stamp(txt,x,y,r,tl,col){if(tl<0)return;const p=bko(clamp(tl/0.18,0,1));
 ctx.save();ctx.translate(x,y);ctx.scale(p,p);ctx.rotate(-0.06);
 ctx.fillStyle=col||'#17c3ff';ctx.strokeStyle=OUT;ctx.lineWidth=5;
 const w=ctx.measureText(txt).width;
 ctx.font='800 '+r+'px InterBlack';const tw=ctx.measureText(txt).width;
 ctx.beginPath();ctx.roundRect(-tw/2-16,-r*0.75,tw+32,r*1.5,10);ctx.fill();ctx.stroke();
 ctx.fillStyle='#04121c';ctx.textAlign='center';ctx.fillText(txt,0,r*0.36);ctx.restore();}
function particles(t,x0,x1,y0,y1,n,hue){for(let i=0;i<n;i++){
 const p=(t*0.25+R(i))%1;const x=x0+(x1-x0)*R(i+30), y=y1+(y0-y1)*p;
 ctx.globalAlpha=0.7*Math.sin(p*Math.PI);ctx.fillStyle=hue;
 ctx.beginPath();ctx.arc(x,y,1.5+2.5*R(i+60),0,7);ctx.fill();}ctx.globalAlpha=1;}
function arrows(t,tl){if(tl<0)return;const a=clamp(tl/0.3,0,1);
 for(const ax of [96,444]){for(let i=0;i<3;i++){
  const yy=180+i*90+((t*120)%90);
  ctx.globalAlpha=a*(0.85-i*0.2);ctx.fillStyle='#ffb13d';ctx.strokeStyle=OUT;ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(ax-22,yy);ctx.lineTo(ax+22,yy);ctx.lineTo(ax,yy+30);ctx.closePath();
  ctx.fill();ctx.stroke();}}ctx.globalAlpha=1;}
function flash(a){ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.fillRect(0,0,W,H);}
function ruler(al,t){if(al<=0)return;ctx.save();ctx.globalAlpha=al;
 ctx.strokeStyle='#eafcff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(508,170);ctx.lineTo(508,820);ctx.stroke();
 ctx.font='800 13px InterBlack';ctx.fillStyle='#eafcff';ctx.textAlign='right';
 for(let i=0;i<=13;i++){const y=170+i*50;
  ctx.beginPath();ctx.moveTo(i%4==0?484:494,y);ctx.lineTo(508,y);ctx.stroke();
  if(i%4==0)ctx.fillText((180-Math.round(i*4.6))+'',484,y+5);}
 const dy=170+650*((t*0.8)%1);
 ctx.fillStyle='#4ff0c0';ctx.beginPath();ctx.arc(508,dy,5,0,7);ctx.fill();
 ctx.restore();}

// measured VO map (silencedetect -32dB/0.18):
// 0.00 right now | 1.07 tallest line | 4.69 while you slept | 5.72 gel discs soak water
// 10.22 +2cm taller | 13.21 all day | 13.95 gravity squeezes | 16.81 you shrink
// 18.38 astronauts no gravity | 20.56 +5cm home | 23.79 sleep 24.81 grow 25.72 shrink 26.69 repeat
window.renderAt=function(t){
 const T=t;
 ctx.setTransform(1,0,0,1,0,0);
 ctx.clearRect(0,0,cv.width,cv.height);ctx.save();ctx.scale(2,2);
 // V3.1 impact micro-shake (morph hits)
 let shx=0,shy=0;
 const shk=(t0,dur,amp)=>{const p=(T-t0)/dur;if(p>=0&&p<1){const d=1-p;shx+=Math.sin(T*211.3+t0)*amp*d;shy+=Math.cos(T*187.7+t0*2)*amp*d;}};
 shk(11.02,0.36,5);shk(15.28,0.34,4);
 const dw=Math.max(0,Math.min(1,T/1.0,(27.8-T)/1.0));
 const cdx=dw*(1.6*Math.sin(2*Math.PI*T*7/27.8)+0.9*Math.sin(2*Math.PI*T*17/27.8));
 const cdy=dw*(1.3*Math.sin(2*Math.PI*T*9/27.8)+0.7*Math.sin(2*Math.PI*T*23/27.8));
 ctx.translate(shx+cdx,shy+cdy);
 ctx.fillStyle='#000';ctx.fillRect(-8,-8,W+16,H+16);
 const S=(a,b)=>t>=a&&t<b;const L=a=>t-a;

 if(S(0,1.07)){
  const zstep=(t>0.45?0.02:0);
  ctx.filter='contrast(1.16) brightness(1.09) saturate(1.12)';
  shot(IM.A,1.0+0.05*(t/1.07)+zstep,0,-14*(t/1.07));
  const br=0.5-0.5*Math.cos(2*Math.PI*t/3.0889);
  if(br>0.02){ctx.globalAlpha=br*0.85;shot(IM.AB,1.0+0.05*(t/1.07)+zstep,0,-14*(t/1.07));ctx.globalAlpha=1;}
  ctx.filter='none';
  vig();
  ruler(1,t);
  cap([['RIGHT ','#fff'],['NOW...','#17c3ff']],54,140,t+1.0);  // instant-on frame-0 still-hook
 }
 else if(S(1.07,4.689)){
  const k=L(1.07)/3.62;
  const wm=ez(clamp((t-1.35)/0.8,0,1));   // STRETCH MOTION: arms mid -> full up (tight)
  shot(IM.AW2,1.02+0.08*k,0,-30*k);
  if(wm>0){ctx.globalAlpha=wm;shot(IM.AW,1.02+0.08*k,0,-30*k);ctx.globalAlpha=1;}
  if(wm>0.35&&wm<0.65)flash(0.10);   // sells blend as motion pop
  vig();
  ruler(1-clamp(L(1.5)/0.4,0,1),t);
  cap([['you are the ','#fff'],['TALLEST','#17c3ff'],[' you\'ll be','#fff']],30,845,L(1.07));
  cap([['ALL DAY','#ffd23e']],34,890,L(2.0));
  if(L(1.07)<0.1)flash(0.2*(1-L(1.07)/0.1));
 }
 else if(S(4.689,10.221)){
  const k=L(4.689)/5.53;
  const zstep=(t>5.72?0.04:0);
  shot(IM.B,1.04+0.12*k+zstep,30*k,-30+20*k);
  particles(t,150,390,240,840,16,'rgba(80,220,255,0.6)');      // water rising into discs
  particles(t*0.6+5,120,420,300,880,10,'rgba(160,240,255,0.35)');
  particles(t,330,470,330,620,26,'rgba(120,230,255,0.9)');
  vig();
  cap([['while you ','#fff'],['SLEPT...','#9fd8ff']],34,140,L(4.689)-0.03);
  cap([['your spine ','#fff'],['DISCS','#17c3ff'],[' soak up ','#fff'],['WATER','#17c3ff']],28,860,L(5.72));
 }
 else if(S(10.221,13.214)){
  const k=L(10.221)/3.0;
  const pulse=1+0.012*Math.sin(t*6);
  const mo=ez(clamp((t-10.5)/1.1,0,1));   // MORPH dry->juicy
  shot(IM.CT,(1.06+0.09*k)*pulse,0,0);
  if(mo>0){ctx.globalAlpha=mo;shot(IM.C,(1.06+0.09*k)*pulse,0,0);ctx.globalAlpha=1;}
  if(mo>0.1&&mo<0.95)flash(0.10*Math.sin(mo*Math.PI));
  particles(t,180,420,520,820,20,'rgba(140,235,255,0.95)');
  vig();
  stamp('+2 CM',270,210,40,L(10.221),'#4ff0c0');
  cap([['2 centimeters ','#fff'],['TALLER','#4ff0c0']],32,870,L(10.4));
  if(L(10.221)<0.1)flash(0.25*(1-L(10.221)/0.1));
 }
 else if(S(13.214,18.384)){
  const k=L(13.214)/5.17;
  const zstep=(t>16.81?0.05:0);
  const mo=ez(clamp((t-14.5)/1.6,0,1));   // MORPH tall->slouched
  shot(IM.DT,1.02+0.09*k+zstep,-20+30*k,20*k);
  if(mo>0){ctx.globalAlpha=mo;shot(IM.D,1.02+0.09*k+zstep,-20+30*k,20*k);ctx.globalAlpha=1;}
  if(t>16.1){const br2=0.5-0.5*Math.cos(2*Math.PI*(t-16.1)/2.6);
   if(br2>0.02){ctx.globalAlpha=br2*0.9;shot(IM.DB,1.02+0.09*k+zstep,-20+30*k,20*k);ctx.globalAlpha=1;}}
  if((t>16.6&&t<16.76)||(t>17.7&&t<17.86)){  // BLINK
   ctx.globalAlpha=0.95;shot(IM.DBL,1.02+0.09*k+zstep,-20+30*k,20*k);ctx.globalAlpha=1;}
  ctx.fillStyle='rgba(20,10,0,'+(0.10*mo)+')';ctx.fillRect(0,0,W,H);
  arrows(t,L(14.5));
  vig();
  cap([['all day, ','#fff'],['GRAVITY','#ffb13d'],[' squeezes it ','#fff'],['OUT','#ffb13d']],27,140,L(13.95));
  cap([['...and you ','#fff'],['SHRINK','#ff5b4d']],36,870,L(16.81));
  if(t>16.81&&t<16.91)flash(0.2);
 }
 else if(S(18.384,23.220)){
  const k=L(18.384)/4.84;
  const bob=6*Math.sin(t*1.8), rot=0.008*Math.sin(t*1.3);
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(rot);ctx.translate(-W/2,-H/2);
  shot(IM.E,1.05+0.08*k,0,bob);
  ctx.restore();
  particles(t,60,480,120,900,14,'rgba(255,255,255,0.5)');
  vig();
  cap([['astronauts have ','#fff'],['NO GRAVITY','#17c3ff']],28,140,L(18.384)-0.03);
  stamp('+5 CM',270,250,44,L(20.56),'#17c3ff');
  cap([['they come home ','#fff'],['5 CM TALLER','#4ff0c0']],28,870,L(20.56));
 }
 else{ // S6 loop back to sleep
  const k=clamp(L(23.220)/4.58,0,1);
  ctx.filter='contrast(1.16) brightness(1.09) saturate(1.12)';
  shot(IM.A,1.10-0.10*ez(k),0,-40*(1-ez(k)));   // zooms back out to EXACT S1 frame-0 framing
  const br3=0.5-0.5*Math.cos(2*Math.PI*t/3.0889);
  if(br3>0.02){ctx.globalAlpha=br3*0.85;shot(IM.AB,1.10-0.10*ez(k),0,-40*(1-ez(k)));ctx.globalAlpha=1;}
  ctx.filter='none';
  vig();
  ruler(clamp((t-26.9)/0.5,0,1),t);
  if(t<24.75)cap([['SLEEP.','#fff']],40,850,L(23.79));
  else if(t<25.66)cap([['GROW.','#4ff0c0']],40,850,L(24.81));
  else if(t<26.62)cap([['SHRINK.','#ffb13d']],40,850,L(25.72));
  else if(t<27.35)cap([['REPEAT.','#17c3ff']],40,850,L(26.69));
 }
 grain(t);
 ctx.restore();
};
</script></body></html>
