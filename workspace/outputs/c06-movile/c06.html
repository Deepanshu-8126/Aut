</style></head><body><canvas id="cv" width="1080" height="1920"></canvas><script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');

const IMG={},VSEQ={};let loaded=0,vtotal=0;for(const k in VC)vtotal+=VC[k];

for(const k in SRC){IMG[k]=new Image();IMG[k].onload=()=>{loaded++;maybeReady();};IMG[k].src=SRC[k];}
for(const k in VC){VSEQ[k]=[];for(let i=1;i<=VC[k];i++){const im=new Image();im.onload=()=>{loaded++;maybeReady();};
 im.src='file:///var/tmp/c06seq/'+k+'_'+String(i).padStart(3,'0')+'.jpg';VSEQ[k].push(im);}}
Promise.all([document.fonts.load('80px OswaldB'),document.fonts.load('30px Mono')]).then(()=>{window.FONTSOK=1;maybeReady();});
// noise tile
const nz=document.createElement('canvas');nz.width=270;nz.height=480;
{const c2=nz.getContext('2d'),d=c2.createImageData(270,480);
 for(let i=0;i<d.data.length;i+=4){const v=120+Math.random()*120;d.data[i]=v;d.data[i+1]=v;d.data[i+2]=v;d.data[i+3]=22;}
 c2.putImageData(d,0,0);}
function vframe(k,lt){const a=VSEQ[k];return a[clamp(Math.floor(lt*30),0,a.length-1)];}
function cover(img,z,px=0,py=0){const iw=img.width,ih=img.height,s=Math.max(W/iw,H/ih)*z;
 const w=iw*s,h=ih*s;ctx.drawImage(img,(W-w)/2+px*(w-W)/2,(H-h)/2+py*(h-H)/2,w,h);}

 ctx.font=size+'px OswaldB';ctx.textAlign='center';ctx.textBaseline='middle';
 const mw=ctx.measureText(txt).width,fit=Math.min(1,500/mw);ctx.scale(fit,fit);

function sub(txt,y,tl,col=AMB){if(tl<0)return;const p=clamp(tl/0.15,0,1);

 ctx.fillStyle=RED;ctx.fillText(txt,0,1);ctx.restore();}
function tab(t){ctx.save();ctx.globalAlpha=0.85;ctx.font='15px Mono';ctx.textAlign='left';

 if(S(0,1.43)){const ramp=clamp((L(0)-0.1)*8,0,1),lt0=L(0),shk=ramp*Math.min(1,lt0*9)*(1-eo(lt0/0.6));
  if(lt0<0.55){const zz=(lt0<0.1)?1.44:(1.44-0.10*eo((lt0-0.1)/0.45));

  cover(vframe('fg',t),1.1);ctx.restore();dk(0.18);
  if(lt0>0.12&&lt0<0.22){ctx.fillStyle='rgba(255,60,60,'+(0.25*(1-(lt0-0.12)/0.1))+')';ctx.fillRect(0,0,W,H);}
  big('1986.',H*0.40,96,L(0)-0.02);
  stamp('CLASSIFIED',W/2,H*0.59,-0.1,L(0.12));
  sub("43\u00b049'N  28\u00b033'E \u2014 ROMANIA",H*0.67,L(0.5));}
 else if(S(1.43,2.37)){cover(IMG.hatch,1.12+0.14*eo(L(1.43)/0.9),0.15-0.45*eo(L(1.43)/0.94),0.25);
  ctx.save();ctx.globalAlpha=0.3;ctx.globalCompositeOperation='screen';
  cover(vframe('fg',t),1.1);ctx.restore();dk(0.2);
  big('ROMANIA.',H*0.40,84,L(1.43));
  stamp('CLASSIFIED',W/2,H*0.59,-0.1,1);}
 else if(S(2.37,4.3)){vcover('pp',L(2.37),1.08+0.05*eo(L(2.37)/1.9));dk(0.25);
  big('WORKERS DRILLING',H*0.36,58,L(2.37));

  const dp=clamp(L(2.37)/1.93,0,1),dm=(dp*18).toFixed(1);
  ctx.save();ctx.strokeStyle=AMB;ctx.lineWidth=2.5;ctx.setLineDash([7,6]);ctx.lineDashOffset=-t*40;
  ctx.beginPath();ctx.moveTo(W-80,120);ctx.lineTo(W-80,120+dp*520);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=AMB;ctx.beginPath();ctx.moveTo(W-80,124+dp*520);ctx.lineTo(W-88,108+dp*520);ctx.lineTo(W-72,108+dp*520);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(W-180,62,166,44);

  ctx.font='13px Mono';ctx.textAlign='left';ctx.fillStyle='rgba(232,180,74,0.8)';ctx.fillText('BOREHOLE DEPTH',W-170,78);
  ctx.font='24px Mono';ctx.fillStyle='#fff';ctx.fillText(dm+' m',W-170,99);ctx.restore();}
 else if(S(4.3,5.4)){const bl=L(4.3),bsh=(1-eo(bl/0.4));
  vcover('mn',bl,1.1+0.06*bsh,-0.15+0.05*Math.sin(t*47)*bsh,0.04*Math.sin(t*41)*bsh);dk(0.3);
  if(bl<0.14){ctx.fillStyle='rgba(255,255,255,'+(0.3*(1-bl/0.14))+')';ctx.fillRect(0,0,W,H);}
  big('BREAK INTO',H*0.34,62,bl);big('A CHAMBER',H*0.43,62,bl-0.15);
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(W-200,62,186,34);

  ctx.font='17px Mono';ctx.textAlign='left';ctx.fillStyle='#FF3B3B';ctx.fillText('⚠ BREAKTHROUGH 18m',W-192,84);ctx.restore();}
 else if(S(5.4,7.4)){vcover('cv',L(5.4),1.06+0.06*eo(L(5.4)/2));dk(0.32);
  big('SEALED FOR',H*0.33,54,L(5.4));
  big('5,500,000 YEARS',H*0.43,66,L(5.75),AMB);}
 else if(S(7.4,11.37)){vcover('fg',L(7.4),1.05);dk(0.3);
  big('THE AIR IS POISON.',H*0.32,56,L(7.4));

 else if(S(11.37,13.79)){vcover('up',L(11.37),1.05+0.08*eo(L(11.37)/2.4));dk(0.22);
  big('AND YET \u2014',H*0.34,58,L(11.37),AMB);
  big("IT'S CRAWLING WITH LIFE",H*0.45,56,L(12.18));}
 else if(S(13.79,15.02)){vcover('sp',L(13.79),1.12);dk(0.15);
  big('BLIND SPIDERS.',H*0.34,60,L(13.79));

 else if(S(15.02,16.12)){cover(IMG.wall,1.16-0.06*eo(L(15.02)),-0.2,0);dk(0.12);
  big('WHITE LEECHES.',H*0.32,60,L(15.02));}
 else if(S(16.12,17.6)){cover(IMG.scorp,1.14-0.06*eo(L(16.12)/1.5),0.15,0.1);dk(0.1);

 else if(S(17.6,20.43)){
  dk(1);ctx.fillStyle='#0d0c0a';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H*0.47);ctx.rotate(-0.03*(1-0.3*eo(L(17.6)/2.8)));
  const ph=330,pw=440;

  ctx.restore();
  ctx.save();ctx.strokeStyle=AMB;ctx.lineWidth=4;ctx.beginPath();ctx.arc(lx,ly,lr,0,7);ctx.stroke();

  ctx.beginPath();ctx.moveTo(lx-lr+10,ly);ctx.lineTo(lx+lr-10,ly);ctx.moveTo(lx,ly-lr+10);ctx.lineTo(lx,ly+lr-10);ctx.stroke();

  ctx.font='15px Mono';ctx.textAlign='center';ctx.fillStyle='#333';
  ctx.fillText('SPECIMEN \u2014 CAVE AMPHIPOD (REAL PHOTO)',0,ph/2-24);ctx.restore();
  const cnum=Math.min(37,Math.ceil(clamp(L(17.6)/0.45,0,1)*37));

  post(t);tab(t);ctx.restore();return;}
 else if(S(20.43,24.32)){vcover('bt',L(20.43),1.05+0.05*eo(L(20.43)/3.9));dk(0.3);

 else if(S(24.32,29.72)){
  ctx.fillStyle='#020308';ctx.fillRect(0,0,W,H);

 else if(S(29.72,33.34)){vcover('ry',L(29.72),1.04+0.06*eo(L(29.72)/3.6));dk(0.28);

 else{const lt=L(33.34),dur=2.06;window.TXF=1-clamp((lt-1.25)/0.45,0,1);
