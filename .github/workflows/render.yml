name: Render video

on:
  workflow_dispatch:
    inputs:
      series:
        description: "Choose series: dsa, python-100-days, python-shorts, etc."
        required: true
        default: dsa
        type: choice
        options:
          - dsa
          - python-100-days
          - dsa-30-days
          - python-shorts
          - java-100-days
          - ai_ml
          - shorts_tips
      lang:
        description: "en | hi | both"
        required: true
        default: both
        type: choice
        options: [en, hi, both]
      topic:
        description: "Topic / Title (Khali chhodo to series se next topic uthega)"
        required: false
        type: string
      script:
        description: "Apni Custom Script (Optional - Khali chhodo to Gemini AI auto generate karega)"
        required: false
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: System deps (ffmpeg, LaTeX, and headless browser libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev texlive-latex-base texlive-latex-extra texlive-fonts-recommended dvisvgm fonts-dejavu libnss3 libnspr4 libasound2t64 libgbm1 libatk-bridge2.0-0 libgtk-3-0

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install google-genai manim edge-tts soundfile numpy requests

      - name: Node deps
        run: npm ci

      - name: Ensure Chrome for HyperFrames
        run: npx -y hyperframes@0.8.143 browser ensure

      - name: Render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_API_TOKEN: ${{ secrets.VOICE_API_TOKEN }}
          SCRIPT_INPUT: ${{ inputs.script }}
        run: |
          ARGS="--series '${{ inputs.series }}' --lang '${{ inputs.lang }}'"
          if [ -n "${{ inputs.topic }}" ]; then
            ARGS="$ARGS --topic '${{ inputs.topic }}'"
          fi
          if [ -n "$SCRIPT_INPUT" ]; then
            printf '%s' "$SCRIPT_INPUT" > custom_script.txt
            ARGS="$ARGS --script-file custom_script.txt"
          fi
          eval "python3 -u pipeline/run.py $ARGS"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.series }}-${{ github.run_id }}
          path: output/**/*.mp4
          retention-days: 14
          if-no-files-found: warn
