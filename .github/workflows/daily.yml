name: Daily video (autopilot)

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 13:30 IST (1:30 PM IST, 1 se 2 PM ke beech)
  workflow_dispatch:
    inputs:
      series:
        description: "Kaun sa video banana hai"
        type: choice
        required: true
        default: python-shorts
        options:
          - python-shorts
          - python-100-days
          - java-100-days
          - dsa-30-days
      lang:
        description: "en, hi ya en,hi"
        required: false
        default: ""
      upload:
        description: "YouTube par upload karna hai?"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System deps (ffmpeg, browser libs)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libnspr4 libnss3 libasound2t64

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Remotion deps
        run: cd remotion && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund)

      - name: Generate audio assets (music + sfx, git mein .wav nahi hoti)
        run: |
          python3 pipeline/make_bgm.py
          python3 pipeline/make_sfx.py

      - name: Autopilot (script -> video -> upload)
        env:
          SERIES: ${{ github.event.inputs.series || 'python-shorts' }}
          LANGS: ${{ github.event.inputs.lang }}
          DO_UPLOAD: ${{ github.event_name == 'schedule' || github.event.inputs.upload == 'true' || github.event.inputs.upload == true }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--series $SERIES"
          [ -n "$LANGS" ] && ARGS="$ARGS --lang $LANGS"
          [ "$DO_UPLOAD" = "true" ] && ARGS="$ARGS --upload"
          python3 pipeline/autopilot.py $ARGS

      - name: Save state and meta
        run: |
          git config user.name "yt-automator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ config/series.json tests/ output/meta/ || true
          git commit -m "autopilot: daily run" || echo "nothing to commit"
          git push || echo "push skipped"
