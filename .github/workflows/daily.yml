name: Daily video (autopilot)

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 13:30 IST (1:30 PM IST) -> Python Shorts
    - cron: "0 20 * * *"  # 20:00 UTC = 01:30 IST (1:30 AM IST) -> Java 100 Days Long Video
  workflow_dispatch:
    inputs:
      series:
        description: "Kaun sa video banana hai (auto = time slot ke hisaab se)"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - java-100-days
          - python-shorts
          - python-100-days
          - dsa-30-days
      lang:
        description: "en, hi ya en,hi"
        required: false
        default: ""
      upload:
        description: "YouTube par upload karna hai?"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System deps (ffmpeg, browser libs)
        run: sudo apt-get update && (sudo apt-get install -y ffmpeg libnspr4 libnss3 libasound2t64 || sudo apt-get install -y ffmpeg libnspr4 libnss3 libasound2)

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Remotion deps
        run: cd remotion && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund)

      - name: Generate audio assets (music + sfx, git mein .wav nahi hoti)
        run: |
          python3 pipeline/make_bgm.py
          python3 pipeline/make_sfx.py

      - name: Autopilot (script -> video -> upload)
        env:
          INPUT_SERIES: ${{ github.event.inputs.series }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          LANGS: ${{ github.event.inputs.lang }}
          DO_UPLOAD: ${{ github.event_name == 'schedule' || github.event.inputs.upload == 'true' || github.event.inputs.upload == true }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$INPUT_SERIES" ] && [ "$INPUT_SERIES" != "auto" ]; then
            TARGET_SERIES="$INPUT_SERIES"
          elif [ "$EVENT_SCHEDULE" = "0 20 * * *" ]; then
            TARGET_SERIES="java-100-days"
          elif [ "$EVENT_SCHEDULE" = "0 8 * * *" ]; then
            TARGET_SERIES="python-shorts"
          else
            # Fallback by UTC hour: 18-23 or 0-3 = Night slot (Java long video), else afternoon slot (Python shorts)
            H=$(date -u +%H)
            if [ "$H" -ge 18 ] || [ "$H" -le 3 ]; then
              TARGET_SERIES="java-100-days"
            else
              TARGET_SERIES="python-shorts"
            fi
          fi
          echo "Selected Series: $TARGET_SERIES"
          ARGS="--series $TARGET_SERIES"
          [ -n "$LANGS" ] && ARGS="$ARGS --lang $LANGS"
          [ "$DO_UPLOAD" = "true" ] && ARGS="$ARGS --upload"
          python3 pipeline/autopilot.py $ARGS

      - name: Save state and meta
        run: |
          git config user.name "yt-automator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ config/series.json tests/ output/meta/ || true
          git commit -m "autopilot: daily run" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || echo "push skipped"
